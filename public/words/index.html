<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Say it with me — Kide</title>
<meta name="description" content="Your child chooses a companion, names them, and helps them through a world where every word is a little bit of speech practice. Nothing is scored. Nothing ever leaves the device.">
<meta name="theme-color" content="#F5E7CF">
<link rel="canonical" href="https://kide.us/words">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root{
    --alabaster:#F5F2EB; --ink:#2E3A3F; --ink-soft:#5B6A67; --ink-faint:#9AA6A3;
    --sunstone:#E17C5B; --sunstone-ink:#8A3F22; --bloom-gold:#FFB347;
    --twilight:#5B6C8A; --card:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--alabaster);color:var(--ink);-webkit-font-smoothing:antialiased;
       line-height:1.45;padding:0 0 calc(20px + env(safe-area-inset-bottom,0px))}
  .wrap{max-width:760px;margin:0 auto;padding:12px 14px}
  .topbar{display:flex;align-items:center;gap:8px;padding:6px 0 12px}
  .icon-btn{width:48px;height:48px;min-width:48px;border-radius:50%;border:2px solid #E6DFCE;
    background:#fff;font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    text-decoration:none;color:var(--ink)}
  .spacer{flex:1}
  h1{font-size:22px;margin:0 0 4px;text-align:center}
  .lead{color:var(--ink-soft);font-size:15px;margin:0 0 16px;text-align:center}
  .stage{position:relative;border-radius:24px;overflow:hidden;box-shadow:0 8px 0 rgba(0,0,0,.07);background:#F1E6D2}
  .sc-svg{display:block;width:100%;height:auto;aspect-ratio:1200/600}
  @media (max-width:700px){ .sc-svg{aspect-ratio:3/2} }
  .sc-layer{will-change:transform}
  .sc-caption{position:absolute;left:0;right:0;bottom:0;pointer-events:none;padding:16px 18px 18px;
    background:linear-gradient(180deg,rgba(0,0,0,0),rgba(46,32,20,.5));
    color:#FFF7E6;font-size:20px;font-weight:800;text-shadow:0 2px 6px rgba(46,32,20,.45);
    min-height:60px;display:flex;align-items:flex-end}
  .sc-choices{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;padding:16px 6px 4px;min-height:20px}
  .sc-obj{border:none;background:var(--card);border-radius:22px;padding:12px 16px;min-height:104px;min-width:106px;
    box-shadow:0 6px 0 rgba(138,63,34,.14);cursor:pointer;font:inherit;
    display:flex;flex-direction:column;align-items:center;gap:2px;
    transition:transform .12s cubic-bezier(.2,.9,.3,1.3),box-shadow .12s}
  .sc-obj:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(138,63,34,.14)}
  .sc-obj-art{width:62px;height:62px;display:block}
  .sc-obj-art svg{display:block}
  .sc-obj-label{font-size:17px;font-weight:800;color:var(--ink)}
  @keyframes sc-bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-5px) rotate(-1.2deg)}}
  @keyframes sc-wobble{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
  @keyframes sc-bounce{0%,100%{transform:translateY(0)}45%{transform:translateY(-18px)}}
  #a-bob{transform-origin:102px 176px}
  @media (prefers-reduced-motion: reduce){ #a-bob{animation:none !important} }
  .say-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:14px}
  .big-btn{font:inherit;font-size:19px;font-weight:800;padding:16px 26px;min-height:60px;min-width:60px;
    border-radius:999px;border:none;background:var(--sunstone);color:var(--ink);cursor:pointer;
    box-shadow:0 5px 0 rgba(138,63,34,.35)}
  .big-btn.ghost{background:#fff;color:var(--ink);border:2px solid #E6DFCE;box-shadow:0 4px 0 rgba(0,0,0,.06)}
  .big-btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(138,63,34,.35)}
  .picker{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:6px}
  .pick{border:3px solid #E6DFCE;background:#fff;border-radius:22px;padding:14px 12px;cursor:pointer;
    font:inherit;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:150px}
  .pick[aria-pressed="true"]{border-color:var(--sunstone);box-shadow:0 0 0 4px rgba(225,124,91,.18)}
  .pick .mini{width:82px;height:82px}
  .pick b{font-size:17px}
  .pick span{font-size:12.5px;color:var(--ink-faint);text-align:center;line-height:1.3}
  .names{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px}
  .name-btn{font:inherit;font-size:18px;font-weight:800;padding:14px 20px;min-height:56px;min-width:56px;
    border-radius:999px;border:3px solid #E6DFCE;background:#fff;color:var(--ink);cursor:pointer}
  .name-btn[aria-pressed="true"]{border-color:var(--sunstone);background:#FDF1EB}
  .daybar{height:8px;border-radius:4px;margin-top:14px;
    background:linear-gradient(90deg,var(--bloom-gold),#F5E7CF 45%,var(--twilight));position:relative}
  .daybar i{position:absolute;top:-5px;width:18px;height:18px;border-radius:50%;background:#fff;
    box-shadow:0 1px 5px rgba(0,0,0,.25);transform:translateX(-9px);transition:left .6s ease}
  .quiet{font-size:13px;color:var(--ink-faint);text-align:center;margin-top:16px}
  .hidden{display:none !important}
  .voice-row{margin-top:18px;text-align:center}
  .link-btn{font:inherit;font-size:14px;font-weight:700;color:var(--ink-soft);background:none;
    border:none;text-decoration:underline;cursor:pointer;min-height:44px;padding:10px 14px}
  .sheet{position:fixed;inset:0;background:rgba(46,32,20,.45);display:flex;align-items:flex-end;
    justify-content:center;z-index:40;padding:0}
  .sheet .inner{background:#fff;border-radius:24px 24px 0 0;max-width:560px;width:100%;
    padding:24px 22px calc(24px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}
  .sheet h2{font-size:19px;margin:0 0 10px}
  .sheet p{font-size:15px;color:var(--ink-soft);margin:0 0 12px}
  .sheet ul{margin:0 0 14px;padding-left:20px;font-size:15px;color:var(--ink-soft)}
  .sheet li{margin-bottom:6px}
  .sheet .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
</style>
<link rel="stylesheet" href="../mobile.css">
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="icon-btn" href="/play" aria-label="Back to Pip's garden">🌿</a>
    <div class="spacer"></div>
    <a class="icon-btn" href="/parent/" aria-label="For grown-ups">⚙️</a>
  </div>

  <!-- 1 · who -->
  <section id="stepWho">
    <h1>Who shall we take with us?</h1>
    <p class="lead">Whoever your child picks will be waiting for them next time.</p>
    <div class="picker" id="actorPicker"></div>
  </section>

  <!-- 2 · name -->
  <section id="stepName" class="hidden">
    <h1 id="nameTitle">What shall we call them?</h1>
    <p class="lead">The name your child chooses is the very first word they practise.</p>
    <div class="names" id="namePicker"></div>
    <div class="say-row"><button class="big-btn" id="btnBegin" disabled>Let's go</button></div>
  </section>

  <!-- 3 · play -->
  <section id="stepPlay" class="hidden">
    <div class="stage" id="stage"></div>
    <div class="sc-choices" id="choices"></div>
    <div class="say-row" id="sayRow"></div>
    <div class="daybar"><i id="dayDot" style="left:0%"></i></div>
    <p class="quiet" id="quiet">Tapping always works. Saying it out loud is optional.</p>

    <!-- Grown-ups only. Deliberately small, plain and at the bottom: a
         two-year-old must not be able to turn on their own microphone, and a
         child-facing toggle is exactly how that happens. -->
    <div class="voice-row" id="voiceRow">
      <button class="link-btn" id="btnVoice">For grown-ups: let Pip listen too</button>
      <p class="quiet" id="voiceStatus"></p>
    </div>
  </section>
</div>

<script type="module">
import { LessonEngine } from '../engine/engine.js';
import { Scene } from '../scene/scene.js';
import { actorList, getActor, ASLEEP, portraitSvg } from '../scene/actors.js';
import { namesFor, nameAsTarget, nameIsScoreable } from '../scene/naming.js';
import * as Journal from '../engine/journal.js';
import * as Profile from '../engine/profile.js';
import * as Consent from '../engine/consent.js';
import * as Speech from '../engine/speech.js';
import { startScoringInBackground, previewTier, resampleTo16kMono, SAMPLE_RATE }
  from '../engine/scoring.js';

const $ = (id) => document.getElementById(id);
const BEATS_PER_DAY = 12;

let actor = null, chosenName = null, scene = null, engine = null, offer = null, ended = false;
let vocab = null;
window.__kideWords = () => ({ actor, chosenName, engine, ended, beats: engine?.learner.beat });

/* SCORING.
 *
 * Off until a grown-up turns it on, and off again the moment they withdraw --
 * the consent record is shared with the quiz game (see consent.js), so one yes
 * covers both surfaces and one revoke silences both.
 *
 * Loading never blocks play. The child is already playing on the tap tier at
 * zero bytes while the model downloads in the background; voice simply starts
 * working part-way through a session, or next session, or never on a bad
 * connection -- and the game was complete the whole time.
 *
 * There is no cloud tier here and no setting that could enable one. */
let scorer = null;
let micReady = false;

async function enableVoice(){
  if (!Consent.granted()) return;
  const { scorer: s, ready } = startScoringInBackground({
    allowMic: true,
    onProgress: (p) => {
      if (p.phase === 'downloading' && p.total) {
        setVoiceStatus(`Getting Pip's ears ready — ${Math.round((p.loaded / p.total) * 100)}%. Keep playing.`);
      } else if (p.phase === 'failed') {
        setVoiceStatus('Listening is not available on this device. Tapping still works perfectly.');
      }
    },
  });
  scorer = s;
  if (engine) engine.scorer = scorer;
  const info = await ready;
  micReady = info.tier !== 'tap';
  if (engine) engine.scorer = scorer;
  setVoiceStatus(micReady
    ? `Pip is listening on this device${info.phonemeLevel ? '' : ' (word by word)'}. Nothing is recorded or sent.`
    : 'This device cannot listen privately, so Pip will not ask to. Tapping works exactly the same.');
  if (engine && engine.current) showSay(engine.current.word.w);
}

function setVoiceStatus(t){ const el = $('voiceStatus'); if (el) el.textContent = t; }

async function loadVocab(){
  if (vocab) return vocab;
  try { vocab = await (await fetch('/bench/data/vocab.json')).json(); }
  catch { vocab = {}; }
  return vocab;
}

/* ---------------------------------------------------------------- step 1 */
// iOS will not play audio unless the first play() happens inside a real user
// gesture. Step 1 is a tap, so we spend it on the unlock -- otherwise the
// opening line would be the one line a child never hears.
document.addEventListener('pointerdown', () => Speech.unlock(), { once: true });
// A tab that goes to the background must go quiet. A voice continuing from a
// pocket or a locked screen is alarming, and it is also speech nobody hears.
document.addEventListener('visibilitychange', () => { if (document.hidden) Speech.stop(); });
function renderWho(){
  $('actorPicker').innerHTML = actorList().map((a) => `
    <button class="pick" data-a="${a.id}" aria-pressed="${actor && actor.id === a.id}">
      <span class="mini">${miniSvg(a)}</span>
      <b>${a.defaultName}</b>
      <span>${a.species}</span>
    </button>`).join('');
  $('actorPicker').querySelectorAll('.pick').forEach((b) => {
    b.addEventListener('click', () => {
      actor = getActor(b.dataset.a);
      chosenName = null;
      renderWho();
      Speech.say(Speech.CHROME.nameFirst);
      $('stepWho').classList.add('hidden');
      $('stepName').classList.remove('hidden');
      $('nameTitle').textContent = `What shall we call ${actor.species.replace(/^an? /, '')}?`;
      renderNames();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });
}

/** A small portrait for the chooser: the actor's own rig, scaled down, so what
    a child picks is exactly who turns up.
    Ids are STRIPPED -- four portraits plus the stage would otherwise put five
    copies of #a-root in the document. See portraitSvg() in actors.js. */
function miniSvg(a){
  return `<svg viewBox="0 0 200 190" width="100%" height="100%" aria-hidden="true">
            <g transform="translate(0,-6) scale(0.98)">${portraitSvg(a)}</g></svg>`;
}

/* ---------------------------------------------------------------- step 2 */
function renderNames(){
  const names = namesFor(actor.id, 4);
  $('namePicker').innerHTML = names.map((n) => `
    <button class="name-btn" data-n="${n.name}" aria-pressed="${chosenName?.name === n.name}">${n.name}</button>`).join('');
  $('namePicker').querySelectorAll('.name-btn').forEach((b) => {
    b.addEventListener('click', () => {
      chosenName = names.find((n) => n.name === b.dataset.n);
      renderNames();
      Speech.nameVoice(chosenName.name).then((v) => v.length && Speech.sayAll(v));
      $('btnBegin').disabled = false;
    });
  });
}

$('btnBegin').addEventListener('click', () => { Profile.save({
  actorId: actor.id, companionName: chosenName.name, concern: 'unclear',
}); begin(); });

/* ---------------------------------------------------------------- step 3 */
/**
 * Wait for the current line to FINISH being spoken before the next one starts.
 *
 * This replaces every fixed gap between two lines. A fixed gap is what
 * truncated Pip in the garden games: the caption was overwritten while the
 * clip was still playing, so a child heard the first word of a sentence and
 * nothing else. A floor keeps the pacing unhurried when nothing is spoken at
 * all (no pack, no on-device voice), and a ceiling means a stalled clip can
 * never freeze the game.
 */
const SPEECH_CEILING_MS = 9500;      /* > the 9000ms cap inside speech.js */
async function said(minMs, maxMs){
  const spoken = scene ? scene.spoken : Promise.resolve(false);
  await Promise.race([
    Promise.all([spoken, wait(minMs || 0)]),
    wait(maxMs || SPEECH_CEILING_MS),
  ]);
}

async function begin(){
  $('stepWho').classList.add('hidden');
  $('stepName').classList.add('hidden');
  $('stepPlay').classList.remove('hidden');
  window.scrollTo({ top: 0, behavior: 'smooth' });

  scene = new Scene($('stage'), actor, $('choices'));
  // Every caption from here on is spoken. Routing it through the scene
  // rather than each call site is what makes it impossible to add a line
  // later that a pre-reader silently cannot access.
  scene.withVoice((lines) => Speech.sayAll(lines));
  engine = new LessonEngine({
    companionName: chosenName.name, concern: 'unclear',
    // `scorer` is null until a grown-up enables listening; the engine treats a
    // null scorer as tap-only, which is a complete way to play.
    scorer, journal: Journal.record,
  });
  ended = false;

  // The name is the first word. For the toy it is also what wakes it up --
  // nothing happens until the child speaks (or taps) for the first time.
  const v = await loadVocab();
  const first = nameAsTarget(chosenName, v);
  const art = await scene.loadArt('HIDDEN');
  scene.render({ affordance: 'HIDDEN', state: actor.wakes ? ASLEEP : 'WAIT', art,
                 caption: actor.wakes ? actor.stall(chosenName.name) : `Someone's here!` });
  scene.setTimeOfDay(0);

  engine.current = {
    target: { ph: first.ph, pos: first.pos, a: 1, b: 1, lvl: 2, lastBeat: -99, n: 0 },
    word: first, affordance: 'HIDDEN', station: null, beat: 0,
  };
  engine.attempt = 0;
  // Spoken as two clips so the name/word is the real recorded take.
  scene.say(actor.wakes
    ? `Can you say ${first.w}? That's how ${first.w} wakes up.`
    : `Can you say ${first.w}?`,
    [Speech.CHROME.wake, Speech.wordLine(first.w)]);
  showSay(first.w);
}

/** The one action a child ever takes.
 *
 *  Two buttons only when the microphone is genuinely available: say it, or tap
 *  it. Tapping is never the lesser option and is never labelled as one -- it
 *  is how a child in a noisy room, or a shy child, or a child on a device that
 *  cannot listen privately, plays the same game. */
function showSay(word){
  const speak = micReady
    ? `<button class="big-btn" id="btnSpeak">🎤 Say &ldquo;${word}&rdquo;</button>` : '';
  const tap = `<button class="big-btn${micReady ? ' ghost' : ''}" id="btnSaid">${
    micReady ? 'Tap instead' : `I said &ldquo;${word}&rdquo;`}</button>`;
  $('sayRow').innerHTML = speak + tap;
  $('btnSaid').addEventListener('click', () => resolveAttempt(null));
  if (micReady) $('btnSpeak').addEventListener('click', listenOnce);
}

/** Record a short clip and let the scorer judge it. Any failure at all --
 *  permission, hardware, decode -- falls through to a tap, because a child
 *  must never be blocked by the microphone. */
async function listenOnce(){
  const btn = $('btnSpeak');
  if (btn) { btn.disabled = true; btn.textContent = '🎤 Listening…'; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
    });
    const rec = new MediaRecorder(stream);
    const chunks = [];
    rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
    const stopped = new Promise((r) => (rec.onstop = r));
    rec.start();
    await wait(1800);                       // long enough for a word, short enough for a toddler
    rec.stop();
    await stopped;
    stream.getTracks().forEach((t) => t.stop());

    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const buf = await ctx.decodeAudioData(await new Blob(chunks).arrayBuffer());
    await ctx.close();
    await resolveAttempt(await resampleTo16kMono(buf));
  } catch {
    // Never surface a microphone error to a child. It just becomes a tap.
    await resolveAttempt(null);
  }
}

async function resolveAttempt(pcm){
  if (!engine || !engine.current || ended) return;
  $('sayRow').innerHTML = '';
  const r = await engine.submitAttempt(pcm);

  // Not heard clearly, and attempts remain: the companion models the sound and
  // asks again, warmth unchanged. Never a failure, never a score.
  if (!r.resolves) {
    scene.pose('MODEL').say(r.say);
    await said(1400);
    scene.pose('ASK').say(`Let's try together — ${engine.current.word.w}.`,
      [Speech.CHROME.tryAgain, Speech.wordLine(engine.current.word.w)]);
    showSay(engine.current.word.w);
    return;
  }

  if (actor.wakes && scene.asleep) scene.setAsleep(false);
  scene.pose('TRIUMPH').say(r.say);
  await scene.reveal(engine.current.word.w);
  nextOffer();
}

async function nextOffer(){
  if (ended) return;
  if (engine.learner.beat >= BEATS_PER_DAY) return goodnight();

  offer = engine.offerBeat({ count: 3 });
  const first = offer.choices[0];
  const art = await scene.loadArt(first.affordance);
  scene.render({ affordance: first.affordance, state: 'WAIT', art,
    caption: 'Where shall we go?', voice: [Speech.CHROME.where],
    objects: offer.choices.map((c) => ({ label: c.word.w })),
    onPick: pick });
  scene.setTimeOfDay(engine.learner.beat / BEATS_PER_DAY);
  $('dayDot').style.left = `${(engine.learner.beat / BEATS_PER_DAY) * 100}%`;
  $('sayRow').innerHTML = '';
}

async function pick(i){
  const prev = engine.current?.affordance;
  const beat = engine.chooseBeat(i);
  const art = await scene.loadArt(beat.affordance);
  if (prev && prev !== beat.affordance) await scene.panTo(beat.affordance, { art });
  else scene.render({ affordance: beat.affordance, state: 'WAIT', art });
  scene.setTimeOfDay(engine.learner.beat / BEATS_PER_DAY);
  scene.pose('STUCK').say(actor.stall(engine.companionName));
  const invite = await Speech.askVoice(beat.affordance, beat.word.w, engine.companionName);
  await said(850);
  scene.pose('ASK').say(beat.invitation, invite);
  showSay(beat.word.w);
}

async function goodnight(){
  ended = true;
  scene.setTimeOfDay(1);
  $('dayDot').style.left = '100%';
  scene.clearChoices();
  scene.pose('WAIT').say(`The light is going down. ${engine.companionName} is getting sleepy…`,
    [Speech.CHROME.sleepy]);
  $('sayRow').innerHTML =
    `<button class="big-btn" id="btnNight">Goodnight, ${engine.companionName}</button>`;
  $('btnNight').addEventListener('click', () => {
    scene.say(`Goodnight! See you next time.`, [Speech.CHROME.goodnight]);
    $('sayRow').innerHTML = '<a class="big-btn ghost" href="/play">Back to the garden</a>';
  });
  $('quiet').textContent = 'The day ended on its own — nobody had to take the tablet away.';
}

const wait = (ms) => new Promise((r) => setTimeout(r, ms));

/* --------------------------------------------------------- consent sheet */
/* The moment a parent decides. Written to be read by someone who is sceptical,
   because they should be: they are being asked about a microphone in a room
   with their child in it. Every claim here is one the code actually keeps --
   see scoring.js (no cloud tier exists) and journal.js (audio cannot be
   persisted; the allow-list is enforced on write). */
function openVoiceSheet(){
  const already = Consent.granted();
  const el = document.createElement('div');
  el.className = 'sheet';
  el.innerHTML = `
    <div class="inner" role="dialog" aria-modal="true" aria-label="Let Pip listen">
      <h2>${already ? 'Pip is allowed to listen' : 'Shall Pip listen too?'}</h2>
      <p>Your child can already play by tapping. Turning this on lets them
         answer out loud instead — which is the part that actually practises
         their speech.</p>
      <ul>
        <li><b>Nothing is recorded and nothing is sent.</b> The sound becomes a
            word on this device, for a moment, and is then gone.</li>
        <li><b>No voice is ever stored.</b> Not a recording, not a voiceprint,
            nothing that could identify your child by how they sound.</li>
        <li><b>If a device can't do this privately, we don't ask for the
            microphone at all.</b> There is no cloud option to switch on.</li>
        <li>Turning it off again stops it everywhere, immediately.</li>
      </ul>
      <p style="font-size:13.5px">Your child is never told they got a word wrong.
         Pip simply says it again and invites them to have another go.</p>
      <div class="row">
        ${already
          ? '<button class="big-btn ghost" id="voiceOff">Turn listening off</button>'
          : '<button class="big-btn" id="voiceOn">Yes, let Pip listen</button>'}
        <button class="big-btn ghost" id="voiceClose">${already ? 'Close' : 'Not now'}</button>
      </div>
    </div>`;
  document.body.appendChild(el);
  const close = () => el.remove();
  el.addEventListener('click', (e) => { if (e.target === el) close(); });
  el.querySelector('#voiceClose').addEventListener('click', close);
  el.querySelector('#voiceOn')?.addEventListener('click', async () => {
    Consent.grant('ondevice');
    close();
    renderVoiceRow();
    setVoiceStatus('Getting Pip\'s ears ready. Keep playing — it works in the background.');
    enableVoice();
  });
  el.querySelector('#voiceOff')?.addEventListener('click', () => {
    Consent.revoke();
    scorer = null; micReady = false;
    if (engine) engine.scorer = null;
    close();
    renderVoiceRow();
    setVoiceStatus('Listening is off. Tapping works exactly as before.');
    if (engine && engine.current) showSay(engine.current.word.w);
  });
}

function renderVoiceRow(){
  const b = $('btnVoice');
  if (!b) return;
  b.textContent = Consent.granted()
    ? 'For grown-ups: listening settings'
    : 'For grown-ups: let Pip listen too';
}

/* ------------------------------------------------------------------ boot */
$('btnVoice')?.addEventListener('click', openVoiceSheet);

(async () => {
  renderVoiceRow();

  // Consent already given on a previous visit (possibly in the quiz game --
  // it is one shared record). Start loading straight away; play is not blocked.
  if (Consent.granted()) {
    enableVoice();
  } else {
    // Say honestly, before anything is downloaded, what this device could do.
    const t = await previewTier({ allowMic: true });
    if (t === 'tap' || t === 'gop-wasm-or-tap') {
      setVoiceStatus('');
    }
  }

  const saved = Profile.load();
  if (saved) {
    // They have played before: the same companion is waiting, by name. Being
    // asked to choose again would tell a child the choice did not matter.
    actor = getActor(saved.actorId);
    const v = await loadVocab();
    chosenName = namesFor(actor.id, 12).find((n) => n.name === saved.companionName)
      || { name: saved.companionName, ph: [], target: 'b_initial' };
    if (!chosenName.ph.length) {
      // A name we have no recording for still works -- it just is not the
      // first practice target. Never synthesise it (see naming.js).
      chosenName = namesFor(actor.id, 1)[0];
    }
    begin();
  } else {
    actor = getActor('goldendoodle');
    renderWho();
  }
})();
</script>
