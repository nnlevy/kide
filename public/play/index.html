/* ------------------------------ interactions ------------------------------- */

function showAffirm(text){
  let n = document.querySelector(".affirm");
  if(!n){ n = document.createElement("div"); n.className="affirm"; document.body.appendChild(n); }
  n.textContent = text; n.classList.add("show");
  clearTimeout(n._t); n._t = setTimeout(()=>n.classList.remove("show"), 1100);
}

function wireScreen(){
  app.querySelectorAll("[data-act]").forEach(btn=>{
    btn.addEventListener("click", onAction, {passive:true});
  });
  if(state.screen==="play"){
    const optWrap = document.getElementById("optWrap");
    if(optWrap) optWrap.addEventListener("click", onOptionTap);
  }
  if(state.screen==="routine"){
    const sc = document.getElementById("scene");
    if(sc) sc.addEventListener("click", routineTap, {passive:true});
  }
  if(state.screen==="gate"){
    app.querySelectorAll(".gate-opt").forEach(b=>b.addEventListener("click", onGateTap));
  }
  if(state.screen==="settings"){
    const slider = document.getElementById("sessLen");
    if(slider) slider.addEventListener("input", e=>{
      document.getElementById("sessLenVal").textContent = e.target.value+" min";
      settings.sessionMinutes = parseInt(e.target.value,10);
      saveJSON(SETTINGS_KEY, settings);
    });
    const submit = document.getElementById("leadSubmit");
    if(submit) submit.addEventListener("click", submitLead);
    const sw = document.getElementById("shareWeek");
    if(sw) sw.addEventListener("click", shareWeek);
    const ms = document.getElementById("muteSwitch");
    if(ms) ms.addEventListener("click", function(){
      if(window.KideVoice) KideVoice.setMuted(voiceOn());
      render();
    });
    const ls = document.getElementById("listenSwitch");
    if(ls) ls.addEventListener("click", function(){
      if(!window.KideVoice) return;
      if(listenOn()){ KideVoice.setListenEnabled(false); render(); }
      else { state.screen = "consent"; render(); }   // never switch a mic on without the consent screen
    });
  }
}

function onAction(e){
  const act = e.currentTarget.getAttribute("data-act");
  // Any deliberate tap ends the current listening turn — the child chose the
  // other way in, and a mic left open would answer the next screen's question.
  if(window.KideVoice && act !== "replay"){ KideVoice.mic.stop(); KideVoice.mic.indicator("idle"); }
  if(act==="letsplay"){ state.screen="handoff"; render(); }
  else if(act==="handover"){
    // This tap is the grown-up's last one, and it is also what unlocks audio.
    if(window.KideVoice){ KideVoice.unlock().then(function(){ state.screen="hello"; render(); }); }
    else { state.screen="hello"; render(); }
  }
  else if(act==="grant-listen"){ grantListening(); }
  else if(act==="revoke-listen"){
    if(window.KideVoice) KideVoice.consent.revoke();
    render();
  }
  else if(act==="parents-back"){ state.screen="settings"; render(); }
  else if(act==="listen-setup"){ state.screen="consent"; render(); }
  else if(act==="start"){ state.screen="garden"; render(); }
  else if(act==="home"){ stopSession(); state.screen="home"; render(); }
  else if(act==="garden"){ state.screen="garden"; state.question=null; render(); }
  else if(act==="parents"){ state.gateFrom="settings"; state.screen="gate"; render(); }
  else if(act==="playlevel"){
    state.level = e.currentTarget.getAttribute("data-level");
    state.question = null;
    state.screen = "play";
    startSessionIfNeeded();
    render();
  }
  else if(act==="playroutine"){ startRoutine(e.currentTarget.getAttribute("data-routine")); }
  else if(act==="routine-again"){ startRoutine(state.routine ? state.routine.key : "potty"); }
  else if(act==="sleepytap"){ goToGoodbye(); }
  else if(act==="replay"){ speakScreen(true); }
  else if(act==="mute"){
    if(window.KideVoice){ KideVoice.setMuted(!KideVoice.muted()); }
    render();
  }
}

/* Consent, then the browser's own permission prompt — in that order, so a
   parent has read plain English before a system dialog appears. */
function grantListening(){
  const box = document.getElementById("consentActions");
  const setBusy = function(t){ if(box) box.innerHTML = '<p class="mic-state" style="text-align:center">'+t+'</p>'; };
  if(!window.KideVoice) return;
  setBusy("Setting up…");
  const step = (micStatus === "downloadable" || micStatus === "downloading")
    ? KideVoice.mic.install().then(function(ok){ return ok ? refreshMicStatus() : "unsupported"; })
    : Promise.resolve(micStatus);
  step.then(function(){
    return KideVoice.mic.permission();
  }).then(function(ok){
    if(!ok){ micStatus = "unsupported"; render(); return; }
    KideVoice.consent.grant("ondevice");
    KideVoice.setListenEnabled(true);
    return refreshMicStatus().then(function(){ render(); });
  }).catch(function(){ render(); });
}

function onGateTap(e){
  const val = parseInt(e.currentTarget.getAttribute("data-val"),10);
  if(val===state.gateTarget){
    state.screen = state.gateFrom==="settings" ? "settings" : "home";
    render();
  }else{
    e.currentTarget.animate([{transform:"translateX(0)"},{transform:"translateX(-6px)"},{transform:"translateX(6px)"},{transform:"translateX(0)"}], {duration:300});
  }
}

function onOptionTap(e){
  const btn = e.target.closest("[data-val]");
  if(!btn) return;
  // A tap ends the listening turn — the child chose the other way in.
  if(window.KideVoice){ KideVoice.mic.stop(); KideVoice.mic.indicator("idle"); }
  listenTries = 99;
  answerWith(btn);
}

/* Single answer path, whether the answer arrived by finger or by voice. */
function answerWith(btn){
  if(!btn || state.awaitingNext) return;
  const q = state.question;

  if(q.type==="shapes-collect"){
    const val = btn.getAttribute("data-val");
    if(val===q.target){
      btn.classList.add("collected");
      q.got++;
      sfxCorrect(); burstFromEl(btn,8);
      document.getElementById("basketCount").textContent = q.got+" / "+q.need+" collected";
      if(q.got>=q.need){
        recordAnswer("shapes", true);
        recordPractice(q.target, true, answerSource); answerSource = "tap";
        state.awaitingNext = true;
        const ai = Math.floor(Math.random()*AFFIRM_WORDS.length);
        showAffirm(AFFIRM_WORDS[ai]);
        const pipC = document.getElementById("pipChar"); if(pipC) pipC.classList.add("celebrate");
        afterSpeech(say("affirm-"+(ai+1)), 900).then(()=>{
          state.awaitingNext=false; newQuestion("shapes"); render();
        });
      }
    }else{
      btn.classList.add("wrong"); sfxTry();
      setTimeout(()=>btn.classList.remove("wrong"), 400);
    }
    return;
  }

  const val = btn.getAttribute("data-val");
  const targetStr = String(q.target);
  const correct = val===targetStr;
  state.awaitingNext = true;

  if(correct){
    btn.classList.add("correct-flash");
    sfxCorrect(); burstFromEl(btn,12);
    const ai = Math.floor(Math.random()*AFFIRM_WORDS.length);
    showAffirm(AFFIRM_WORDS[ai]);
    // Counting is the one case where naming the answer teaches more than
    // praising it — Pip says "Three!" and the praise stays on screen.
    const line = say(q.type==="counting" ? ("answer-"+q.target) : ("affirm-"+(ai+1)));
    const pipC = document.getElementById("pipChar"); if(pipC) pipC.classList.add("celebrate");
    recordAnswer(state.level, true);
    recordPractice(q.target, true, answerSource); answerSource = "tap";
    updateHudLeafBar();
    afterSpeech(line, 950).then(()=>{
      state.awaitingNext=false; newQuestion(state.level); render();
    });
  }else{
    btn.classList.add("wrong-flash");
    sfxTry();
    recordAnswer(state.level, false);
    recordPractice(q.target, false, answerSource); answerSource = "tap";
    state.missOnQuestion++;
    state.awaitingNext = false;
    setTimeout(()=>btn.classList.remove("wrong-flash"), 450);
    if(state.missOnQuestion>=2){
      const correctBtn = document.querySelector('[data-val="'+targetStr+'"]');
      if(correctBtn) correctBtn.classList.add("hint");
      say("hint-1");
    }else{
      const ri = Math.floor(Math.random()*RETRY_WORDS.length);
      showAffirm(RETRY_WORDS[ri]);
      say("retry-"+(ri+1)).then(function(ok){ if(!ok) return; listenTries = 0; maybeListen(); });
    }
  }
}

/* Test seam. The speech-truncation regression test (test-speech.mjs) has to be
   able to reach a specific question type and assert the game does not advance
   while Pip is talking. Exposing these is cheaper and far more honest than
   making the test click through a random walk and hope. */
if (typeof window !== "undefined") {
  window.__kidePlay = {
    get state(){ return state; },
    newQuestion: function(l){ return newQuestion(l); },
    render: function(){ return render(); },
  };
}

function updateHudLeafBar(){
  const bar = document.querySelector(".hud-leaf i");
  if(bar){ const pct = Math.min(100, (state.sessionCorrectByLevel[state.level]/5)*100); bar.style.width = pct+"%"; }
}

/* ------------------------------ session timer ------------------------------ */

function startSessionIfNeeded(){
  if(!state.sessionStart){
    state.sessionStart = Date.now();
    pausedSessionStart = null;
    state.sessionCorrectByLevel = { colors:0, counting:0, shapes:0, letters:0, feelings:0 };
    inviteShown = false; lastInviteAt = 0;
    // Record the handoff. Starts unresolved; goToGoodbye marks it.
    if(!Array.isArray(progress.handoffs)) progress.handoffs = [];
    progress.handoffs.push({ s: state.sessionStart, g: 0 });
    if(progress.handoffs.length > HANDOFF_CAP){
      progress.handoffs = progress.handoffs.slice(-HANDOFF_CAP);
    }
    saveJSON(STORE_KEY, progress);
  }
  if(sessionTimer) clearInterval(sessionTimer);
  sessionTimer = setInterval(tickSession, 4000);
}
function stopSession(){
  if(sessionTimer){ clearInterval(sessionTimer); sessionTimer=null; }
  pausedSessionStart = state.sessionStart;
  state.sessionStart = null; inviteShown=false; lastInviteAt=0;
  removeInvite();
}

/* Backgrounding stops the session; coming back should continue the SAME one —
   same wind-down clock, no second handoff logged. */
let pausedSessionStart = null;
function resumeSession(){
  if(state.screen !== "play" || !pausedSessionStart) return;
  state.sessionStart = pausedSessionStart;
  pausedSessionStart = null;
  if(sessionTimer) clearInterval(sessionTimer);
  sessionTimer = setInterval(tickSession, 4000);
}
function tickSession(){
  if(state.screen!=="play") return;
  document.body.className = bodyStageClass();
  const pipC = document.getElementById("pipChar");
  const frac = sessionFraction();
  if(pipC){
    if(frac>=0.85) pipC.classList.add("sleepy"); else pipC.classList.remove("sleepy");
  }
  if(frac>=0.85){
    const now = Date.now();
    if(!inviteShown || now-lastInviteAt>90000){
      showInvite(); inviteShown = true; lastInviteAt = now;
    }
  }
}
function showInvite(){
  removeInvite();
  const n = document.createElement("div");
  n.className = "invite";
  n.innerHTML =
    '<div style="width:52px;height:52px;flex-shrink:0">'+pipGlowIconHTML()+'</div>'+
    '<div class="itext"><b>Pip is getting sleepy…</b>Should we tuck Pip in for the night?</div>'+
    '<button class="btn btn-primary" id="tuckBtn" style="padding:12px 18px;font-size:16px;white-space:nowrap">Tuck in</button>';
  document.body.appendChild(n);
  document.body.classList.add("kv-raise");   // lift the mic pill clear of the banner
  document.getElementById("tuckBtn").addEventListener("click", goToGoodbye);
  if(window.KideVoice) KideVoice.mic.stop();
  say("sleepy-invite").then(function(ok){ if(ok && document.querySelector(".invite")) maybeListen(); });
}
function removeInvite(){
  const n=document.querySelector(".invite"); if(n) n.remove();
  document.body.classList.remove("kv-raise");
}

function goToGoodbye(){
  sfxChime();
  stopSession();
  progress.goodbyes++;
  // Mark the open handoff as ended with a goodbye.
  if(Array.isArray(progress.handoffs) && progress.handoffs.length){
    progress.handoffs[progress.handoffs.length-1].g = 1;
  }
  saveJSON(STORE_KEY, progress);
  if(window.KideVoice) KideVoice.mic.stop();
  state.screen = "goodbye";
  render();
}

/* -------------------------------- submit lead ------------------------------ */
function submitLead(){
  const input = document.getElementById("leadEmail");
  const email = (input.value||"").trim();
  if(!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    input.focus(); input.style.borderColor = "#FF6F9C"; return;
  }
  settings.email = email; saveJSON(SETTINGS_KEY, settings);
  document.getElementById("leadOk").style.display = "block";
  fetch("/api/notify", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      email: email,
      name: "Kide parent",
      need: "Notify me about new Pip the Sprout concept packs",
      matchedDomain: "kide",
      matchedTitle: "Kide — Pip the Sprout",
      pageUrl: location.href
    })
  }).catch(()=>{ /* offline or blocked — the local save above already succeeded */ });
}

/* --------------------------------- boot ------------------------------------ */
refreshMicStatus().then(function(){
  // The handoff card reports the real capability of THIS device, so it has to
  // be known before that card is ever drawn.
  if(state.screen === "handoff" || state.screen === "consent" || state.screen === "settings") render();
});
render();
document.addEventListener("visibilitychange", ()=>{
  if(document.hidden){
    stopSession();
    if(window.KideVoice){ KideVoice.stop(); KideVoice.mic.stop(); KideVoice.mic.indicator("idle"); }
  }else if(state.screen === "play" || state.screen === "garden"){
    // A toddler who got interrupted has no idea what the question was. Ask again.
    // Resume the wind-down clock where it left off rather than calling
    // startSessionIfNeeded() — that logs a handoff, and the child never left,
    // the tab did. Counting those would inflate the Parent Corner's
    // "you handed Pip over N times" every time the screen locked.
    resumeSession();
    speakScreen(true);
  }
});

})();
</script>
