<style>
:root{
  --sky-top:#56C6E6; --sky-bottom:#BDEBFF;
  --sun:#FFD166; --sun-deep:#FFC94A;
  --grass:#6FD08C; --grass-deep:#4FB874; --grass-dark:#3D9C63;
  --coral:#FF8A73; --coral-deep:#F16E55;
  --berry:#FF8FA8; --berry-deep:#FF6F9C;
  --sand:#4EA8DE; --sand-deep:#3B8FC4;
  --grape:#B497D6; --grape-deep:#9C7BC7;
  --pumpkin:#FF9F5B; --pumpkin-deep:#F2843A;
  --cream:#FFFBF2; --card:#FFFFFF;
  --ink:#2E3A3F; --ink-soft:#5B6A67;
  --dusk-top:#3C5A8A; --dusk-bottom:#7C8FC9;
  --night-top:#232B4D; --night-bottom:#3A3E72;
  --radius-lg:28px; --radius-md:20px; --radius-sm:14px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overscroll-behavior:none;}
body{
  margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Segoe UI",Roboto,sans-serif;
  color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  min-height:100dvh;min-height:100svh;min-height:100vh;
  background:linear-gradient(180deg,var(--sky-top),var(--sky-bottom));
  transition:background 1.6s ease;overflow:hidden;
}
body.stage-warm{background:linear-gradient(180deg,#FFC97A,#FFE3B0);}
body.stage-dusk{background:linear-gradient(180deg,var(--dusk-top),var(--dusk-bottom));}
body.stage-sleepy{background:linear-gradient(180deg,var(--night-top),var(--night-bottom));}
#app{position:relative;min-height:100dvh;min-height:100svh;min-height:100vh;padding-top:var(--safe-t);padding-bottom:var(--safe-b);display:flex;flex-direction:column;overflow:hidden;}
button{font-family:inherit;}
.screen{flex:1;display:flex;flex-direction:column;align-items:center;padding:18px 18px calc(18px + var(--safe-b));position:relative;z-index:2;min-height:0;}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;}

/* decorative clouds */
.cloud{position:absolute;background:#fff;border-radius:50px;opacity:.85;filter:blur(.3px);z-index:1;animation:drift 40s linear infinite;}
.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%;}
.cloud.c1{width:90px;height:32px;top:8%;left:-20%;}
.cloud.c1:before{width:50px;height:50px;top:-24px;left:10px;}
.cloud.c1:after{width:38px;height:38px;top:-16px;left:46px;}
.cloud.c2{width:70px;height:26px;top:18%;left:-20%;animation-duration:55s;animation-delay:-10s;}
.cloud.c2:before{width:38px;height:38px;top:-18px;left:8px;}
.cloud.c2:after{width:30px;height:30px;top:-12px;left:34px;}
.cloud.c3{width:60px;height:22px;top:4%;left:-20%;animation-duration:70s;animation-delay:-30s;}
.cloud.c3:before{width:32px;height:32px;top:-15px;left:6px;}
.cloud.c3:after{width:26px;height:26px;top:-10px;left:28px;}
body.stage-dusk .cloud,body.stage-sleepy .cloud{opacity:.18;}
@keyframes drift{from{transform:translateX(0);}to{transform:translateX(130vw);}}

/* top bar */
.topbar{width:100%;max-width:520px;display:flex;align-items:center;justify-content:space-between;padding:6px 2px 10px;position:relative;z-index:3;}
.icon-btn{width:48px;height:48px;border-radius:50%;border:none;background:rgba(255,255,255,.75);box-shadow:0 3px 0 rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;flex-shrink:0;}
.icon-btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.08);}
.spacer{flex:1;}

/* headings & text */
h1{font-size:clamp(28px,7vw,40px);margin:6px 0 4px;text-align:center;color:var(--ink);}
h2{font-size:clamp(22px,6vw,28px);margin:0 0 6px;text-align:center;color:var(--ink);}
p.lead{font-size:19px;color:var(--ink-soft);text-align:center;margin:0 0 18px;max-width:360px;line-height:1.4;}
.stage-dusk h1,.stage-sleepy h1,.stage-dusk h2,.stage-sleepy h2,.stage-dusk p,.stage-sleepy p{color:#fff;}
.stage-dusk p.lead,.stage-sleepy p.lead{color:#EAF0FF;}

/* buttons */
.btn{border:none;border-radius:999px;padding:18px 34px;font-size:22px;font-weight:800;cursor:pointer;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.12);transition:transform .08s;}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.12);}
.btn.big{font-size:26px;padding:22px 44px;}
.btn-primary{background:linear-gradient(180deg,var(--coral),var(--coral-deep));}
.btn-secondary{background:linear-gradient(180deg,var(--sand),var(--sand-deep));}
.btn-ghost{background:rgba(255,255,255,.85);color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.08);}
.btn:disabled{opacity:.45;}

/* PIP MASCOT */
.pip-wrap{position:relative;display:flex;align-items:center;justify-content:center;width:100%;height:100%;}
.pip{position:relative;width:100%;height:100%;}
.pip-shadow{position:absolute;bottom:-6%;left:50%;width:58%;height:10%;background:rgba(0,0,0,.16);border-radius:50%;transform:translateX(-50%);filter:blur(2px);}
.pip-bob{width:100%;height:100%;animation:bob 3.2s ease-in-out infinite;transform-origin:bottom center;}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-4%) rotate(-1.5deg);}}
.pip-body{position:absolute;left:8%;right:8%;bottom:4%;top:14%;background:linear-gradient(160deg,var(--grass),var(--grass-deep));border-radius:48% 48% 46% 46% / 58% 58% 42% 42%;box-shadow:inset 0 -10px 18px rgba(0,0,0,.10),inset 0 8px 14px rgba(255,255,255,.35);}
.pip-belly{position:absolute;left:26%;right:26%;bottom:8%;height:38%;background:var(--grass-dark);opacity:.28;border-radius:50%;}
.pip-cheek{position:absolute;width:13%;height:8%;background:var(--berry);opacity:.55;border-radius:50%;top:56%;}
.pip-cheek.l{left:14%;}.pip-cheek.r{right:14%;}
.pip-eye{position:absolute;width:19%;height:22%;background:#fff;border-radius:50%;top:32%;box-shadow:0 2px 3px rgba(0,0,0,.08);transition:height .15s,top .15s;}
.pip-eye.l{left:22%;}.pip-eye.r{right:22%;}
.pip-pupil{position:absolute;width:52%;height:52%;background:var(--ink);border-radius:50%;top:26%;left:26%;animation:blink 5.5s ease-in-out infinite;}
@keyframes blink{0%,92%,100%{transform:scaleY(1);}94%{transform:scaleY(.15);}96%{transform:scaleY(1);}}
.pip-mouth{position:absolute;left:32%;right:32%;top:60%;height:16%;}
.pip-sprout{position:absolute;top:-6%;left:50%;transform:translateX(-50%);width:34%;height:26%;}
.pip-stem{position:absolute;bottom:0;left:50%;width:6%;height:70%;background:var(--grass-dark);transform:translateX(-50%);border-radius:3px;}
.pip-leaf{position:absolute;width:46%;height:32%;background:linear-gradient(160deg,#8CE3A9,var(--grass-deep));border-radius:0% 100% 0% 100%;bottom:32%;}
.pip-leaf.n1{left:2%;transform:rotate(-18deg);}
.pip-leaf.n2{right:2%;transform:rotate(18deg) scaleX(-1);bottom:46%;}
.pip-leaf.n3{left:50%;bottom:66%;transform:translateX(-50%);width:40%;height:28%;}

/* sleepy state */
.pip.sleepy .pip-bob{animation-duration:5.5s;}
.pip.sleepy .pip-eye{height:6%;top:40%;}
.pip.sleepy .pip-pupil{animation:none;transform:scaleY(1);}
.pip.sleepy .zzz{position:absolute;top:-8%;right:2%;font-size:22px;font-weight:800;color:#fff;opacity:0;animation:floatz 2.6s ease-in infinite;}
.pip.sleepy .zzz.z2{animation-delay:.6s;right:-6%;font-size:16px;}
@keyframes floatz{0%{opacity:0;transform:translateY(0) scale(.6);}20%{opacity:.9;}100%{opacity:0;transform:translateY(-38px) scale(1.15);}}

/* celebrate */
.pip.celebrate .pip-bob{animation:celebrate .6s ease;}
@keyframes celebrate{0%{transform:translateY(0) rotate(0);}30%{transform:translateY(-22%) rotate(-8deg);}55%{transform:translateY(0) rotate(6deg);}75%{transform:translateY(-8%) rotate(-3deg);}100%{transform:translateY(0) rotate(0);}}

/* sparkle burst */
.sparkle{position:absolute;pointer-events:none;font-size:22px;z-index:20;animation:pop .85s ease-out forwards;}
@keyframes pop{0%{opacity:1;transform:translate(0,0) scale(.4) rotate(0deg);}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.1) rotate(var(--rot));}}

/* HOME */
.home-pip{width:min(56vw,260px);height:min(56vw,260px);margin:4px auto 6px;}
.home-actions{display:flex;flex-direction:column;gap:14px;align-items:center;margin-top:6px;width:100%;}

/* GARDEN / LEVEL SELECT */
.grid{display:grid;grid-template-columns:1fr;gap:16px;width:100%;max-width:420px;margin-top:8px;}
.level-card{display:flex;align-items:center;gap:16px;background:var(--card);border-radius:var(--radius-lg);padding:16px 18px;box-shadow:0 6px 0 rgba(0,0,0,.08);border:none;text-align:left;cursor:pointer;width:100%;}
.level-card:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.08);}
.level-emoji{font-size:40px;width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.level-info{flex:1;}
.level-info b{font-size:21px;display:block;}
.level-info span{font-size:14px;color:var(--ink-soft);}
.leaf-row{display:flex;gap:3px;margin-top:6px;}
.leaf-dot{width:11px;height:11px;border-radius:0 60% 0 60%;background:#DCE7DC;}
.leaf-dot.on{background:var(--grass-deep);}

/* PLAY HUD */
.hud{width:100%;max-width:520px;display:flex;align-items:center;gap:10px;padding:4px 2px 10px;}
.hud-glow{width:52px;height:52px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.65);box-shadow:0 0 0 4px rgba(255,255,255,.35);cursor:pointer;position:relative;}
.hud-glow .g{position:relative;width:38px;height:38px;}
.hud-progress{flex:1;display:flex;gap:5px;}
.hud-leaf{flex:1;height:9px;border-radius:6px;background:rgba(255,255,255,.5);overflow:hidden;}
.hud-leaf i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--grass),var(--grass-deep));transition:width .35s ease;}

/* question card */
.prompt-card{background:var(--card);border-radius:var(--radius-lg);padding:20px 22px;width:100%;max-width:460px;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.08);margin-bottom:16px;}
.prompt-card .p-eyebrow{font-size:14px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em;}
.prompt-card .p-main{font-size:clamp(22px,6vw,30px);font-weight:800;margin-top:4px;}
.stage-item{display:inline-flex;align-items:center;justify-content:center;font-size:44px;margin:6px 6px 0;}

.options{display:grid;gap:14px;width:100%;max-width:460px;}
.options.cols2{grid-template-columns:1fr 1fr;}
.options.cols3{grid-template-columns:1fr 1fr 1fr;}
.opt{border:none;border-radius:var(--radius-md);padding:18px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.10);min-height:96px;justify-content:center;background:var(--card);}
.opt:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.10);}
.opt .oemoji{font-size:38px;}
.opt .oword{font-size:15px;font-weight:700;color:var(--ink-soft);}
.opt.correct-flash{animation:okflash .5s ease;}
.opt.wrong-flash{animation:shake .45s ease;}
.opt.hint{animation:hintpulse 1s ease-in-out infinite;}
@keyframes okflash{0%{box-shadow:0 5px 0 rgba(0,0,0,.10);}40%{box-shadow:0 0 0 6px rgba(111,208,140,.55),0 5px 0 rgba(0,0,0,.10);}100%{box-shadow:0 5px 0 rgba(0,0,0,.10);}}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
@keyframes hintpulse{0%,100%{box-shadow:0 5px 0 rgba(0,0,0,.10),0 0 0 0 rgba(255,209,102,.7);}50%{box-shadow:0 5px 0 rgba(0,0,0,.10),0 0 0 10px rgba(255,209,102,0);}}

.dotwrap{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;max-width:70px;}
.dotwrap span{width:8px;height:8px;border-radius:50%;background:var(--sand-deep);}

/* shapes collect grid */
.shape-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:100%;max-width:420px;}
.shape-tile{aspect-ratio:1;border:none;border-radius:18px;background:var(--card);box-shadow:0 5px 0 rgba(0,0,0,.10);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.shape-tile:active{transform:translateY(2px);}
.shape-tile.collected{visibility:hidden;}
.shape-tile.wrong{animation:shake .4s ease;}
.shape-svg{width:56%;height:56%;}
/* Letters are the content, so they get the room shapes get. Rounded font stack
   already in use; weight does the work, as the brand guide says. */
.opt .oletter{font-size:52px;font-weight:800;line-height:1;color:var(--ink);}
.feel-svg{width:60%;height:60%;max-width:88px;}
.basket{display:flex;align-items:center;gap:10px;margin:10px 0 4px;font-size:16px;color:var(--ink-soft);font-weight:700;}
.basket .bx{font-size:28px;}

/* affirm toast */
.affirm{position:fixed;left:50%;top:14%;transform:translate(-50%,-10px);background:rgba(255,255,255,.95);padding:10px 22px;border-radius:999px;font-weight:800;font-size:19px;color:var(--grass-dark);box-shadow:0 6px 18px rgba(0,0,0,.15);opacity:0;z-index:30;transition:opacity .25s, transform .25s;pointer-events:none;}
.affirm.show{opacity:1;transform:translate(-50%,0);}

/* sleepy invite banner */
.invite{position:fixed;left:12px;right:12px;bottom:calc(14px + var(--safe-b));background:rgba(255,255,255,.96);border-radius:22px;padding:16px 18px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;align-items:center;gap:14px;z-index:40;animation:riseup .4s ease;max-width:480px;margin:0 auto;}
@keyframes riseup{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
.invite .itext{flex:1;font-size:15px;color:var(--ink);line-height:1.3;}
.invite .itext b{display:block;font-size:17px;margin-bottom:2px;}

/* goodbye screen */
.recap{background:rgba(255,255,255,.14);border-radius:var(--radius-lg);padding:18px 20px;width:100%;max-width:420px;margin:14px 0;}
.recap-row{display:flex;align-items:center;justify-content:space-between;color:#fff;font-size:17px;font-weight:700;padding:6px 0;}
.recap-stars{letter-spacing:2px;}

/* parent gate */
.gate-card{background:var(--card);border-radius:var(--radius-lg);padding:26px 24px;max-width:360px;width:100%;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.08);}
.gate-q{font-size:26px;font-weight:800;margin:8px 0 18px;}
.gate-opts{display:flex;gap:12px;justify-content:center;}
.gate-opt{border:none;background:var(--sky-bottom);border-radius:16px;padding:14px 0;width:70px;font-size:22px;font-weight:800;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.08);}
.gate-opt:active{transform:translateY(2px);}

/* settings */
.settings-card{background:var(--card);border-radius:var(--radius-lg);padding:22px;max-width:440px;width:100%;box-shadow:0 6px 0 rgba(0,0,0,.06);margin-bottom:16px;}
.settings-card h3{margin:0 0 8px;font-size:18px;}
.settings-card p{font-size:15px;color:var(--ink-soft);line-height:1.5;margin:0 0 4px;}
.slider-row{display:flex;align-items:center;gap:12px;margin:10px 0 4px;}
.slider-row input[type=range]{flex:1;}
.slider-val{font-weight:800;font-size:16px;width:64px;text-align:right;}
.field{width:100%;padding:14px;border-radius:12px;border:2px solid #E6E6E6;font-size:16px;margin-top:8px;}
.small-note{font-size:12.5px;color:#9AA6A3;text-align:center;margin-top:18px;line-height:1.5;}
.small-note a{color:#9AA6A3;}
.lead-ok{color:var(--grass-dark);font-weight:700;font-size:15px;margin-top:8px;}

@media (min-width:600px){
  .options.cols2{grid-template-columns:1fr 1fr;max-width:420px;}
  .grid{max-width:460px;}
}
/* ---------------- voice: handoff, consent, controls ---------------- */
.handoff-card,.consent-card{background:var(--card);border-radius:var(--radius-lg);padding:26px 24px;
  width:100%;max-width:420px;box-shadow:0 14px 40px rgba(0,0,0,.16);text-align:left;}
.consent-card{max-width:460px;}
.handoff-card h2,.consent-card h2{margin:0 0 6px;font-size:23px;}
.handoff-card p,.consent-card p{margin:0 0 14px;color:var(--ink-soft);font-size:15.5px;line-height:1.6;}
.chips{display:flex;flex-direction:column;gap:8px;margin:16px 0 20px;}
.chip{display:flex;align-items:center;gap:10px;background:#F4F8F5;border-radius:var(--radius-sm);
  padding:11px 14px;font-size:14.5px;font-weight:700;color:var(--ink);}
.chip .ci{font-size:18px;line-height:1;}
.chip .cs{margin-left:auto;font-weight:800;font-size:13px;letter-spacing:.02em;}
.chip.on .cs{color:var(--grass-dark);} .chip.off .cs{color:var(--ink-soft);}
.chip.na{background:#FAF6EE;} .chip.na .cs{color:#B08428;}
.handoff-actions{display:flex;flex-direction:column;gap:10px;}
.hello-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;width:100%;}
.hello-wrap h1{margin:6px 0 4px;}
.tiny-link{background:none;border:0;color:var(--ink-soft);font:700 14px/1 inherit;text-decoration:underline;
  padding:8px;cursor:pointer;}
.toggle-row{display:flex;align-items:center;gap:12px;margin-top:12px;}
.toggle-row .tl{flex:1;font-size:15px;font-weight:700;}
.switch{position:relative;width:56px;height:32px;border-radius:999px;border:0;background:#DCE3DE;
  flex-shrink:0;cursor:pointer;transition:background .18s;}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;
  background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.2);transition:transform .18s;}
.switch[aria-checked="true"]{background:var(--grass);}
.switch[aria-checked="true"]::after{transform:translateX(24px);}
.switch:disabled{opacity:.45;cursor:default;}
.mic-state{font-size:13.5px;color:var(--ink-soft);margin-top:8px;line-height:1.55;}
.prompt-card[data-replay]{cursor:pointer;}
.replay{display:inline-flex;align-items:center;gap:5px;margin-top:8px;font-size:12.5px;font-weight:700;
  color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;}
.voice-pill{position:absolute;top:calc(12px + var(--safe-t));left:12px;z-index:40;border:0;background:rgba(255,255,255,.85);
  border-radius:999px;width:40px;height:40px;font-size:17px;box-shadow:0 3px 10px rgba(0,0,0,.1);cursor:pointer;}
@media (prefers-reduced-motion:reduce){.handoff-card,.consent-card{transition:none;}}

/* ============================ PIP'S TURN =============================
   Pretend-play rehearsal. Deliberately shares nothing with the quiz
   screens: no score, no streak, no timer, no wrong answer, no leaf dots.
   A toddler plays with a waterless play sink because doing the routine
   IS the reward; adding points to that would only get in the way.
   See docs/HABITS.md.
--------------------------------------------------------------------- */
.routine-head{width:100%;max-width:480px;text-align:center;margin-bottom:10px;}
.routine-head .r-say{font-size:clamp(20px,5.4vw,27px);font-weight:800;line-height:1.25;color:var(--ink);}
.routine-head .r-cue{font-size:15.5px;color:var(--ink-soft);font-weight:700;margin-top:6px;min-height:20px;}
.scene{position:relative;width:min(100%,480px,60vh);aspect-ratio:1/1;background:var(--card);
  border-radius:26px;box-shadow:0 6px 0 rgba(0,0,0,.08);overflow:hidden;cursor:pointer;
  -webkit-tap-highlight-color:transparent;user-select:none;}
.scene:active{transform:translateY(2px);box-shadow:0 4px 0 rgba(0,0,0,.08);}
.scene svg{position:absolute;inset:0;width:100%;height:100%;}
/* Pip needs an explicit box: .pip-wrap is 100%/100% of its parent, so a
   parent with no height renders an invisible mascot. */
.scene .sc-pip{position:absolute;width:25%;aspect-ratio:1/1;left:50%;bottom:16%;
  transform:translateX(-50%);
  transition:left .5s cubic-bezier(.4,1.3,.6,1), bottom .5s ease;}
.scene.at-door .sc-pip{left:84%;}
.scene.at-potty .sc-pip{left:26.5%;bottom:25%;}
.scene.at-sink .sc-pip{left:66%;bottom:13%;}
.sc-hit{position:absolute;border-radius:50%;pointer-events:none;}
.sc-hit.on{animation:scpulse 1.6s ease-in-out infinite;}
@keyframes scpulse{
  0%,100%{box-shadow:0 0 0 0 rgba(255,209,102,.85);}
  50%{box-shadow:0 0 0 16px rgba(255,209,102,0);}
}
.sc-fade{opacity:0;transition:opacity .45s ease;}
.sc-fade.show{opacity:1;}
.bub{position:absolute;border-radius:50%;background:rgba(255,255,255,.9);
  box-shadow:inset 0 0 0 2px rgba(86,198,230,.55);animation:bubrise 2.4s ease-in infinite;}
@keyframes bubrise{0%{transform:translateY(0) scale(.6);opacity:0;}
  25%{opacity:.95;}100%{transform:translateY(-70px) scale(1.1);opacity:0;}}
.routine-foot{width:100%;max-width:480px;display:flex;gap:12px;justify-content:center;margin-top:16px;}
.step-dots{display:flex;gap:6px;justify-content:center;margin-top:14px;}
.step-dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.55);}
.step-dots i.done{background:var(--grass-deep);}
.step-dots i.now{background:var(--sun);transform:scale(1.35);}
.routine-card{display:flex;align-items:center;gap:16px;background:var(--card);border-radius:var(--radius-lg);
  padding:16px 18px;box-shadow:0 6px 0 rgba(0,0,0,.08);border:none;text-align:left;cursor:pointer;width:100%;
  outline:3px solid rgba(255,255,255,.75);outline-offset:-3px;}
.routine-card:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.08);}
.garden-sub{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
  color:rgba(46,58,63,.5);margin:22px 0 10px;}
@media (prefers-reduced-motion:reduce){
  .sc-hit.on{animation:none;box-shadow:0 0 0 7px rgba(255,209,102,.5);}
  .bub{animation:none;opacity:.9;}
  .scene .sc-pip{transition:none;}
}

<script>
(function(){
"use strict";

/* ---------------------------------------------------------------------
   PIP THE SPROUT — Kide
   Single-file, offline-first, zero-data-collection toddler learning game.
   No frameworks, no external requests, no analytics, no third-party
   scripts of any kind. Everything below is the entire application.
------------------------------------------------------------------------ */

const STORE_KEY = "pip_ttf_progress_v1";
const SETTINGS_KEY = "pip_ttf_settings_v1";

const DEFAULT_PROGRESS = {
  colors:   { tier: 1, streak: 0, miss: 0, best: 1 },
  counting: { tier: 1, streak: 0, miss: 0, best: 1 },
  shapes:   { tier: 1, streak: 0, miss: 0, best: 1 },
  letters:  { tier: 1, streak: 0, miss: 0, best: 1 },
  feelings: { tier: 1, streak: 0, miss: 0, best: 1 },
  totalCorrect: 0,
  goodbyes: 0,
  routineRuns: 0,
  // Handoff record: one entry per session handed to the child.
  // { s: startedAtMs, g: 1 if it ended with a goodbye, else 0 }
  // Never leaves the device. Capped so localStorage cannot grow without bound.
  handoffs: []
};
const HANDOFF_CAP = 60;
const DEFAULT_SETTINGS = { sessionMinutes: 8, email: "" };

function loadJSON(key, fallback){
  try{
    const raw = localStorage.getItem(key);
    if(!raw) return JSON.parse(JSON.stringify(fallback));
    const parsed = JSON.parse(raw);
    return Object.assign(JSON.parse(JSON.stringify(fallback)), parsed);
  }catch(e){ return JSON.parse(JSON.stringify(fallback)); }
}
function saveJSON(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }

let progress = loadJSON(STORE_KEY, DEFAULT_PROGRESS);
let settings = loadJSON(SETTINGS_KEY, DEFAULT_SETTINGS);

/* ---------------------------- content pools --------------------------- */

const COLORS = {
  red:    { hex:"#FF6B6B", emoji:"🍎", word:"Red" },
  blue:   { hex:"#4EA8DE", emoji:"🫐", word:"Blue" },
  yellow: { hex:"#FFD166", emoji:"🍋", word:"Yellow" },
  green:  { hex:"#6FD08C", emoji:"🍃", word:"Green" },
  purple: { hex:"#B497D6", emoji:"🍇", word:"Purple" },
  orange: { hex:"#FF9F5B", emoji:"🍊", word:"Orange" }
};
const COLOR_TIERS = {
  1:{ pool:["red","blue","yellow"], choices:2 },
  2:{ pool:["red","blue","yellow","green"], choices:3 },
  3:{ pool:["red","blue","yellow","green","purple","orange"], choices:4 }
};

const COUNT_ITEMS = ["⭐","🍎","🎈","🍃","🐚"];
const COUNT_TIERS = {
  1:{ min:1, max:2, choices:2 },
  2:{ min:1, max:3, choices:3 },
  3:{ min:2, max:5, choices:3 }
};

const SHAPES = {
  circle:   { word:"Circle" },
  square:   { word:"Square" },
  triangle: { word:"Triangle" }
};
const SHAPE_TIERS = {
  1:{ pool:["circle","square"] },
  2:{ pool:["circle","square","triangle"] },
  3:{ pool:["circle","square","triangle"], collect:true, gridSize:6 }
};

/* ============================== LETTERS ==============================
   Uppercase letter NAMES, not letter sounds — deliberately.

   Alphabet knowledge is among the strongest predictors of later reading
   (National Early Literacy Panel), and for this age band letter names come
   first: knowing a letter's name makes learning its sound easier rather than
   competing with it (Treiman and colleagues). Sounds already have a home in
   this product — /sounds and the speech engine — so teaching names here and
   sounds there keeps each surface doing one job well.

   THE ORDER IS NOT A TO Z, and that is the whole design.

   1. THE OWN-NAME ADVANTAGE. Children learn the letters in their own name
      before other letters, and the first letter most of all. This game already
      has a name the child chose and cares about: their companion's. So tier 1
      seeds from that name, which means the first letters a child meets are the
      ones they are already motivated to know. A generic A-B-C start throws that
      away.

   2. THE ACROPHONIC CLASSES. English letter names carry the letter's sound in
      three different ways, and children acquire them in that order:
        CV     the sound starts the name  — B "bee", D "dee", P "pee"...
        VC     the sound ends the name    — F "ef", L "el", M "em"...
        OPAQUE the name doesn't contain the sound at all — H, W, Y, Q
      Tiers follow that gradient rather than the alphabet.

   3. VISUAL CONFUSABILITY. Uppercase avoids the b/d/p/q problem that plagues
      lowercase, but E/F, M/W, O/Q, P/R, C/G and V/W are still easy to confuse.
      They are kept out of the same option set in the early tiers, so a child's
      first experience of letters is not a discrimination task they are not
      ready for.

   Uppercase throughout: it is what children recognise first, and it is what is
   on the blocks, the fridge magnets and the front of the cereal box. */

const LETTER_CV     = ["B","D","J","K","P","T","V","Z"];
const LETTER_VC     = ["F","L","M","N","R","S","X"];
const LETTER_VOWEL  = ["A","E","I","O","U"];
const LETTER_OPAQUE = ["C","G","H","Q","W","Y"];
const ALL_LETTERS   = LETTER_CV.concat(LETTER_VC, LETTER_VOWEL, LETTER_OPAQUE).sort();

/* Pairs a young child genuinely mixes up by shape. Kept apart while the task is
   still "what is this letter" rather than "which of these two is it". */
const LETTER_CONFUSABLE = {
  E:["F"], F:["E"], M:["W","N"], W:["M","V"], N:["M"], V:["W","Y"], Y:["V"],
  O:["Q","C","G"], Q:["O"], C:["G","O"], G:["C","O"], P:["R"], R:["P"],
  I:["T","L"], T:["I"], L:["I"], K:["X"], X:["K"], S:["Z"], Z:["S"], U:["V"]
};

const LETTER_TIERS = {
  /* Visually distinct, acrophonically transparent, and high-frequency. */
  1:{ pool:["B","D","K","P","T"],                                   choices:2, avoidConfusable:true },
  2:{ pool:["B","D","K","P","T","A","O","J","V","Z"],               choices:3, avoidConfusable:true },
  3:{ pool:["B","D","K","P","T","A","O","J","V","Z","E","I","U","F","L","M","N","R","S"], choices:3 },
  4:{ pool:ALL_LETTERS,                                             choices:4 }
};

/* The companion name is typed by a child on a keyboard and then rendered into
   the prompt card, so it goes through here first. Self-inflicted and local-only
   as an injection goes, but a name field that reaches innerHTML unescaped is
   not a thing to leave lying around in a children's app. */
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
                  .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

/* The letters of the name the child chose for their companion, which is the
   most motivating word in their vocabulary and the reason tier 1 is personal. */
function ownNameLetters(){
  var n = readCompanionName();
  if(!n) return [];
  var out = [], seen = {};
  String(n).toUpperCase().split("").forEach(function(ch){
    if(ch >= "A" && ch <= "Z" && !seen[ch]){ seen[ch] = 1; out.push(ch); }
  });
  return out;
}

/* ============================== FEELINGS ==============================
   Naming a feeling, in the order children actually acquire the categories.

   Widen & Russell's differentiation account is unusually well replicated
   (81%, 78% and 86% of children fit the predicted sequence across three
   studies): a child who has one emotion label has "happy"; they then add sad
   or angry; then all three; then fear or surprise; disgust last. So the tiers
   are happy/sad → +angry → +scared → +surprised, and disgust is left out
   entirely rather than taught last to a four-year-old who is not there yet.

   THE DESIGN DECISION THAT MATTERS: SITUATIONS BEFORE FACES. The obvious build
   is a row of faces and "which one is sad?". But young children label emotions
   from situations and stories EARLIER and more accurately than from facial
   expressions alone — the face-only task is the harder one, and building only
   that would make this pack feel like failure for exactly the age it is for.
   So tier 1 is entirely situations ("someone's ice cream fell over — how do
   they feel?"), and faces are introduced afterwards.

   TONE. Nobody in these stories is hurt, punished or frightened badly, and
   nothing here is about the child's own family. The scared items are a loud
   dog and a dark room, both resolved in the telling. docs/BRAND.md forbids Pip
   from ever being scared, sad or scolding, so none of these feelings are ever
   Pip's — the faces below are separate, nameless little faces, and Pip stays
   the calm one who asks the question.

   AND THERE IS NO WRONG FEELING. The engine never tells a child they are
   wrong, and on the third try it resolves regardless. That matters more here
   than anywhere else in the game: a child who is told their reading of a
   feeling is incorrect learns something worse than a label. */

const FEELINGS = {
  happy:     { word:"Happy",     face:"#FFD166" },
  sad:       { word:"Sad",       face:"#7FB3D9" },
  angry:     { word:"Angry",     face:"#FF9F5B" },
  scared:    { word:"Scared",    face:"#B497D6" },
  surprised: { word:"Surprised", face:"#6FD08C" }
};

const FEELING_TIERS = {
  1:{ pool:["happy","sad"],                                  choices:2, storyOnly:true },
  2:{ pool:["happy","sad","angry"],                          choices:3 },
  3:{ pool:["happy","sad","angry","scared"],                 choices:3 },
  4:{ pool:["happy","sad","angry","scared","surprised"],     choices:4 }
};

/* Canonical, unambiguous situations — the kind an adult would agree on without
   hesitating, because an ambiguous one teaches nothing and quietly tells a
   child they read it wrongly. Ids double as voice-clip ids. */
const FEELING_STORIES = [
  { id:"story-happy-1",     feel:"happy",     text:"Someone got a big hug." },
  { id:"story-happy-2",     feel:"happy",     text:"Someone's best friend came to play." },
  { id:"story-happy-3",     feel:"happy",     text:"Someone blew out the candles on a cake." },
  { id:"story-sad-1",       feel:"sad",       text:"Someone's ice cream fell on the ground." },
  { id:"story-sad-2",       feel:"sad",       text:"Someone's friend had to go home." },
  { id:"story-sad-3",       feel:"sad",       text:"Someone lost their favourite toy." },
  { id:"story-angry-1",     feel:"angry",     text:"Someone knocked over the tower they just built." },
  { id:"story-angry-2",     feel:"angry",     text:"Someone took the toy right out of their hands." },
  { id:"story-angry-3",     feel:"angry",     text:"Someone had to stop playing before they were ready." },
  { id:"story-scared-1",    feel:"scared",    text:"A very big dog barked, very loudly." },
  { id:"story-scared-2",    feel:"scared",    text:"The lights went out and the room went dark." },
  { id:"story-scared-3",    feel:"scared",    text:"There was a loud crash of thunder outside." },
  { id:"story-surprised-1", feel:"surprised", text:"Someone opened a box, and a puppy was inside!" },
  { id:"story-surprised-2", feel:"surprised", text:"Everyone jumped out and shouted, surprise!" },
  { id:"story-surprised-3", feel:"surprised", text:"Someone found a present they were not expecting." }
];

/* Flat, rounded, no sharp corners — the same shape language as the rest of the
   game. Drawn rather than emoji on purpose: an emotion-recognition task cannot
   be built on glyphs that render as a different expression on every platform,
   which is exactly what happens to the emoji faces across iOS, Android and
   Windows. These render identically everywhere. */
function feelingSvg(key){
  var f = FEELINGS[key]; if(!f) return "";
  var mouth = {
    happy:     '<path d="M32 58 Q50 74 68 58" fill="none" stroke="#2E3A3F" stroke-width="6" stroke-linecap="round"/>',
    sad:       '<path d="M32 68 Q50 52 68 68" fill="none" stroke="#2E3A3F" stroke-width="6" stroke-linecap="round"/>',
    angry:     '<path d="M34 66 Q50 58 66 66" fill="none" stroke="#2E3A3F" stroke-width="6" stroke-linecap="round"/>',
    scared:    '<ellipse cx="50" cy="65" rx="9" ry="11" fill="#2E3A3F"/>',
    surprised: '<circle cx="50" cy="64" r="11" fill="#2E3A3F"/>'
  }[key];
  var brows = {
    happy:     '',
    sad:       '<path d="M28 33 Q35 29 42 33" fill="none" stroke="#2E3A3F" stroke-width="5" stroke-linecap="round"/>'
             + '<path d="M58 33 Q65 29 72 33" fill="none" stroke="#2E3A3F" stroke-width="5" stroke-linecap="round"/>',
    angry:     '<path d="M28 28 L44 36" fill="none" stroke="#2E3A3F" stroke-width="5" stroke-linecap="round"/>'
             + '<path d="M72 28 L56 36" fill="none" stroke="#2E3A3F" stroke-width="5" stroke-linecap="round"/>',
    scared:    '<path d="M28 30 Q35 24 43 29" fill="none" stroke="#2E3A3F" stroke-width="5" stroke-linecap="round"/>'
             + '<path d="M72 30 Q65 24 57 29" fill="none" stroke="#2E3A3F" stroke-width="5" stroke-linecap="round"/>',
    surprised: '<path d="M28 27 Q35 22 43 27" fill="none" stroke="#2E3A3F" stroke-width="5" stroke-linecap="round"/>'
             + '<path d="M72 27 Q65 22 57 27" fill="none" stroke="#2E3A3F" stroke-width="5" stroke-linecap="round"/>'
  }[key];
  var eyeR = (key === "scared" || key === "surprised") ? 8 : 6;
  return '<svg viewBox="0 0 100 100" class="feel-svg" aria-hidden="true">'
    + '<circle cx="50" cy="50" r="46" fill="' + f.face + '"/>'
    + brows
    + '<circle cx="36" cy="45" r="' + eyeR + '" fill="#2E3A3F"/>'
    + '<circle cx="64" cy="45" r="' + eyeR + '" fill="#2E3A3F"/>'
    + mouth
    + '</svg>';
}


/* ========================= PIP'S TURN — routines =========================
   Rehearsal, not assessment. The child helps Pip; the child is never the
   one being tested. Nothing here is scored, timed, or unlockable — see
   docs/HABITS.md for why (short version: material rewards measurably
   reduce toddlers' spontaneous helping, and performance pressure around
   elimination is the causal path to withholding).
========================================================================= */

/* Every step: what Pip says, what the grown-up-facing cue says, which prop
   glows, where Pip stands, and which scene props are visible. A tap
   anywhere on the scene advances — a two-year-old's aim is not the skill
   being practised, so there is no way to miss. */
const R_POTTY_OPEN = [
  { clip:"r-potty-0", say:"Pip's tummy feels wiggly.",        cue:"Tap Pip.",              hit:"pip",   pos:"" },
  { clip:"r-potty-1", say:"Pip needs to go potty!",           cue:"Tap the potty.",        hit:"potty", pos:"" }
];
const R_POTTY_SIT = [
  { clip:"r-potty-2", say:"Here we go — pants down.",         cue:"Tap Pip's pants.",      hit:"pip",   pos:"at-potty", flags:["pants"] },
  { clip:"r-potty-3", say:"Sit down, Pip.",                   cue:"Tap the potty seat.",   hit:"potty", pos:"at-potty", flags:["pants","sit"] },
  { clip:"r-potty-4", say:"Now we wait. Let's hum a song.",   cue:"Wait with Pip.",        hit:"pip",   pos:"at-potty", flags:["pants","sit"] }
];
const R_WENT = [
  { clip:"r-went-0", say:"Pip did it! Right in the potty.",   cue:"Tap the paper.",        hit:"tp",    pos:"at-potty", flags:["pants","sit"] },
  { clip:"r-went-1", say:"All clean. Pants back up!",         cue:"Tap Pip.",              hit:"pip",   pos:"at-potty" },
  { clip:"r-went-2", say:"Now we flush.",                     cue:"Tap the potty.",        hit:"potty", pos:"at-potty" }
];
/* The most important branch in the product. Sitting and producing nothing is
   the ordinary case, not a failure, and it ends exactly as warmly. */
const R_NONE = [
  { clip:"r-none-0", say:"Nothing this time. That's okay!",   cue:"Tap Pip.",              hit:"pip",   pos:"at-potty" },
  { clip:"r-none-1", say:"We can try again later.",           cue:"Tap the sink.",         hit:"sink",  pos:"at-potty" }
];
/* Pip has accidents on purpose, and nobody is cross about it. A child who has
   just wet themselves should have already watched this happen to Pip. */
const R_ACC = [
  { clip:"r-acc-0", say:"Oh! Pip didn't make it in time.",    cue:"Tap Pip.",              hit:"pip",   pos:"", flags:["puddle"] },
  { clip:"r-acc-1", say:"That's okay, Pip. Accidents happen.",cue:"Give Pip a hug.",       hit:"pip",   pos:"", flags:["puddle"] },
  { clip:"r-acc-2", say:"Let's find some dry clothes.",       cue:"Tap the clothes.",      hit:"clothes", pos:"", flags:["puddle","clothes"] },
  { clip:"r-acc-3", say:"All better. We'll try the potty next time.", cue:"Tap the sink.", hit:"sink",  pos:"" }
];
const R_WASH = [
  { clip:"r-wash-0", say:"Time to wash our hands!",           cue:"Turn on the water.",    hit:"tap",   pos:"at-sink" },
  { clip:"r-wash-1", say:"Now some soap.",                    cue:"Tap the soap.",         hit:"soap",  pos:"at-sink", flags:["water"] },
  { clip:"r-wash-2", say:"Scrub, scrub, scrub!",              cue:"Tap Pip's hands.",      hit:"pip",   pos:"at-sink", flags:["water","bubbles"], repeat:3 },
  { clip:"r-wash-3", say:"Rinse them off.",                   cue:"Tap the water.",        hit:"tap",   pos:"at-sink", flags:["water","bubbles"] },
  { clip:"r-wash-4", say:"And dry them.",                     cue:"Tap the towel.",        hit:"towel", pos:"at-sink" }
];
const R_DONE = { clip:"r-done", say:"I did it! Thank you for helping me.", cue:"", pos:"", end:true };

/* Which ending this run gets. Fixed rotation rather than a coin flip so that
   every child meets all three within a handful of plays — and so the very
   first run is the whole happy sequence, start to finish. */
const R_OUTCOMES = ["went","none","went","acc","went","none","went","went","none","acc"];

const ROUTINES = {
  potty: {
    label:"Going Potty", sub:"Help Pip use the potty", emoji:"🚽", bg:"#DFF3FF",
    build(outcome){
      if(outcome === "acc") return R_POTTY_OPEN.slice(0,1).concat(R_ACC, R_WASH, [R_DONE]);
      const tail = outcome === "none" ? R_NONE : R_WENT;
      return R_POTTY_OPEN.concat(R_POTTY_SIT, tail, R_WASH, [R_DONE]);
    }
  },
  handwash: {
    label:"Washing Hands", sub:"Soap, scrub and rinse with Pip", emoji:"🫧", bg:"#E4F7EC",
    build(){
      return [{ clip:"r-handwash-0", say:"Pip's hands are all mucky!", cue:"Tap Pip.", hit:"pip", pos:"" }]
        .concat(R_WASH, [R_DONE]);
    }
  }
};

const AFFIRM_WORDS = ["Yes!","You found it!","Pip is so happy!","Great eyes!","Wonderful!","That's it!"];
const RETRY_WORDS = ["Let's look again!","Almost — try another!","Keep looking!","So close!"];

/* ------------------------------ state ---------------------------------- */

let state = {
  screen: "home",          // home | handoff | hello | garden | play | goodbye | gate | settings | consent
  level: null,             // colors | counting | shapes
  question: null,
  sessionStart: null,
  sessionCorrectByLevel: { colors:0, counting:0, shapes:0, letters:0, feelings:0 },
  awaitingNext: false,
  missOnQuestion: 0,
  collected: [],           // for shapes collect-mode
  routine: null,          // { key, steps, i, taps }
  gateTarget: null,
  gateFrom: "settings",
  qSerial: 0              // increments per question so repeats are not mistaken for re-renders
};

let micStatus = "unsupported";   // available | downloadable | downloading | unsupported
let lastSpoken = null;           // guards against re-speaking on a repeat render
let listenTries = 0;             // attempts spent on the current question
let levelHintGiven = {};         // "say it out loud" is a once-per-level nudge

let sessionTimer = null;
let inviteShown = false;
let lastInviteAt = 0;

/* ------------------------------ helpers --------------------------------- */

function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function pickExcluding(arr, exclude){
  const pool = arr.filter(x=>x!==exclude);
  return pool.length ? pick(pool) : pick(arr);
}
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function el(html){ const t=document.createElement("template"); t.innerHTML=html.trim(); return t.content.firstElementChild; }
function totalMastered(){
  return ["colors","counting","shapes","letters","feelings"].filter(k=>progress[k].best>=3).length;
}
function leavesForCount(n){ return Math.max(1, Math.min(4, n+1)); }

/* -------------------------- adaptive engine ------------------------------
   "Machine-learning principles" here mean: track a rolling performance
   signal per concept, and let it drive item difficulty — the same idea
   behind mastery-based / adaptive-personalization systems, implemented as
   small, transparent rules instead of a trained model. No data leaves the
   device; there is nothing to train a model on even if we wanted to.
--------------------------------------------------------------------------- */
function recordAnswer(levelKey, correct){
  const lv = progress[levelKey];
  if(correct){
    lv.streak++; lv.miss = 0;
    if(lv.streak>=3 && lv.tier<3){ lv.tier++; lv.streak=0; }
    if(lv.tier>lv.best) lv.best = lv.tier;
    if(lv.tier>=3 && lv.streak>=3) lv.best = 3;
    progress.totalCorrect++;
    state.sessionCorrectByLevel[levelKey]++;
  }else{
    lv.streak = 0; lv.miss++;
    if(lv.miss>=3 && lv.tier>1){ lv.tier--; lv.miss=0; }
  }
  saveJSON(STORE_KEY, progress);
}

/* ------------------------------- audio ----------------------------------
   Tiny WebAudio tone synth — no audio files, nothing to load, nothing to
   fetch. Sounds only ever play in direct response to a tap (iOS autoplay
   rules are happy with that, and so are we: no surprise noises).
--------------------------------------------------------------------------- */
let actx = null;
function audioCtx(){
  if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  return actx;
}
function tone(freqs, dur, type){
  const ctx = audioCtx(); if(!ctx) return;
  const t0 = ctx.currentTime;
  freqs.forEach((f,i)=>{
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.type = type||"sine"; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.12, t0+0.02+i*0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur+i*0.05);
    o.connect(g); g.connect(ctx.destination);
    o.start(t0+i*0.05); o.stop(t0+dur+i*0.05+0.05);
  });
}
function sfxCorrect(){ tone([523,659,784], 0.22, "sine"); }
function sfxTry(){ tone([330], 0.14, "sine"); }
function sfxCelebrate(){ tone([523,659,784,1046], 0.28, "triangle"); }
function sfxChime(){ tone([392,494,587], 0.5, "sine"); }

/* ------------------------------- voice -----------------------------------
   Speaking is pre-rendered neural audio shipped as static files (see
   /voice.js). Listening is on-device-only speech recognition, off until a
   grown-up turns it on. Tapping always works and is never gated on either.
--------------------------------------------------------------------------- */

function voiceOn(){ return window.KideVoice && !KideVoice.muted(); }
function listenOn(){
  return !!(window.KideVoice && KideVoice.listenEnabled() && micStatus === "available");
}

function say(id){
  if(!window.KideVoice) return Promise.resolve();
  return KideVoice.speak(id);
}

/* --------------------------- practice evidence ----------------------------
   This game has always asked children to SAY words -- "red", "three",
   "circle" -- and the on-device recogniser has always known whether it heard
   them. That is real speech practice, and until now none of it was recorded.
   Mapping each answer word to the speech sound it carries turns the existing
   game into the evidence source behind the practice record, WITHOUT changing
   anything a child sees or does.

   The distinction that matters, and the one a clinician would check first:
   a TAP is not speech. Both are recorded, because tapping is a valid way to
   play and still counts as practice, but only a spoken answer is ever counted
   as evidence about articulation (see public/engine/clinical.js).

   Nothing leaves the device. No audio is retained -- only which word, which
   sound, and whether it was heard.
--------------------------------------------------------------------------- */
var PLAY_TARGETS = null;
fetch("/data/play-targets.json").then(function(r){ return r.ok ? r.json() : null; })
  .then(function(j){ PLAY_TARGETS = j; }).catch(function(){});

var Journal = null;
import("/engine/journal.js").then(function(m){ Journal = m; }).catch(function(){});

/* How the answer now on screen was given. Set by the mic handler just before
   it clicks the button, so answerWith() can tell speech from a tap. */
var answerSource = "tap";

function recordPractice(word, correct, source){
  if(!Journal || !PLAY_TARGETS) return;
  var t = PLAY_TARGETS[String(word).toLowerCase()];
  if(!t) return;                       // a word we cannot attribute to a sound
  Journal.record({
    at: Date.now(),
    target: t.target,
    word: t.w,
    /* 'native' = the browser's own on-device recogniser heard it. Word-level,
       not phoneme-level, and the report says so. 'tap' contributes adherence
       only. */
    tier: source === "voice" ? "native" : "tap",
    verdict: correct ? "clear" : "unsure",
    forced: false,
    level: 2,
    surface: "play"
  });
}

/* Advance only once Pip has actually finished the line.
 *
 * THE BUG THIS EXISTS TO PREVENT. Two call sites used to start a clip and then
 * advance on a fixed setTimeout(..., 900). speak() begins by calling
 * stopSpeaking(), so the next question's prompt cut the previous line off
 * mid-sentence. Measured against the shipped voice pack, NINE OF FIFTEEN
 * affirm/answer/retry clips are longer than 900ms -- the longest is 3.10s --
 * so Pip was truncated roughly 60% of the time. It read as "Pip only says the
 * first word", which is exactly what a cut-off clip sounds like.
 *
 * A fixed timer can never be right here: clip length is data, not code, and a
 * re-recorded voice pack would silently change the failure rate. So wait for
 * the SPEECH, not the clock:
 *
 *   floor   -- a minimum beat, so a very short clip still gets a moment to
 *              land rather than snapping straight into the next question;
 *   ceiling -- a maximum, so a stalled or blocked audio element can never
 *              freeze the game.
 *
 * THE CEILING IS DERIVED, NOT GUESSED. A first cut used 6000ms and the test
 * caught that the longest clip in the shipped pack (r-potty-4) is 6.91s -- so
 * the safety valve would itself have truncated a real line, reintroducing the
 * very bug it was added to prevent. Fixed constants that must respect the data
 * are how this class of bug happens, so the ceiling is now tied to speak()'s
 * own guarantee: speak() self-resolves at SPEAK_MAX_MS no matter what, and the
 * ceiling sits just beyond it. In normal operation the ceiling therefore never
 * fires -- it only exists for a speak() that is itself broken.
 *
 * Use this for anything that changes what is on screen while Pip is talking.
 */
var SPEAK_MAX_MS = 9000;                    /* must match voice.js speak() */
var SPEECH_CEILING_MS = SPEAK_MAX_MS + 500;
function afterSpeech(speech, minMs, maxMs){
  const floor = new Promise(function(r){ setTimeout(r, minMs || 0); });
  const ceiling = new Promise(function(r){ setTimeout(r, maxMs || SPEECH_CEILING_MS); });
  return Promise.race([ Promise.all([speech, floor]), ceiling ]);
}

function refreshMicStatus(){
  if(!window.KideVoice) return Promise.resolve("unsupported");
  return KideVoice.mic.support().then(function(s){ micStatus = s; return s; });
}

/* Which line belongs to the screen we just drew. */
function promptClip(){
  if(state.screen === "hello")   return "handoff-hello";
  if(state.screen === "home")    return "home-greet";
  // On the garden, the "say it out loud" nudge IS the prompt — playing both
  // would mean eight seconds of Pip talking before a two-year-old gets a turn.
  if(state.screen === "garden")  return listenOn() ? "listen-garden" : "garden-intro";
  if(state.screen === "goodbye") return "goodbye";
  if(state.screen === "routine"){ const st = rStep(); return st ? st.clip : null; }
  if(state.screen !== "play" || !state.question) return null;
  const q = state.question;
  if(q.type === "colors")         return "prompt-color-" + q.target;
  if(q.type === "counting")       return "prompt-count";
  if(q.type === "shapes-pick")    return "prompt-shape-" + q.target;
  if(q.type === "shapes-collect") return "prompt-collect-" + q.target;
  if(q.type === "letters")        return "prompt-letter-" + String(q.target).toLowerCase();
  if(q.type === "feelings-face")  return "prompt-feeling-" + q.target;
  // The story IS the prompt: a pre-reader cannot read the situation off the
  // card, so the clip id is the story id and every story has its own line.
  if(q.type === "feelings-story") return q.story.id;
  return null;
}

/* Hints are once per context, not once per question — three-year-olds don't
   need "say it out loud" before every single item. */
function hintScope(){
  return state.screen === "garden" ? "garden" : (state.screen === "play" ? state.level : state.screen);
}

/* Choosing a game, and answering "should we say goodnight?", are the two
   moments a child is on their own with no question on screen. Both are voice
   navigable, or the promise that they can play before they can read is only
   true for the parts a grown-up already set up for them. */
function gardenVocab(){
  return [
    { key:"colors",   value:"colors" },
    { key:"counting", value:"counting" },
    { key:"shapes",   value:"shapes" },
    { key:"letters",  value:"letters" },
    { key:"feelings", value:"feelings" }
  ];
}

function listenHintClip(){
  if(state.screen === "garden") return null;   // folded into the prompt above
  if(!state.question) return null;
  if(state.question.type === "colors")      return "listen-color";
  if(state.question.type === "counting")    return "listen-count";
  if(state.question.type === "shapes-pick") return "listen-shape";
  if(state.question.type === "letters")     return "listen-letter";
  if(state.question.type === "feelings-face" || state.question.type === "feelings-story") return "listen-feeling";
  return null;
}

/* The vocabulary for a question is exactly the options on screen — which is
   what makes generous pronunciation matching safe. "people" only ever counts
   as "purple" in a question that offers purple at all. */
function questionVocab(){
  const q = state.question;
  if(!q) return [];
  // Collect mode is a tapping game by nature — saying "circle" three times in
  // a row is worse than tapping three tiles, so Pip doesn't listen for it.
  if(q.type === "shapes-collect") return [];
  return (q.options || []).map(function(o){ return { key: String(o), value: String(o) }; });
}

/* Speak the current screen, then hand the turn to the microphone. */
function speakScreen(force){
  if(!window.KideVoice || !KideVoice.isUnlocked()) return;
  const clip = promptClip();
  // Keyed on a serial, NOT on the question's content. Colors repeat constantly
  // in a two-option round, and keying on content meant a repeat looked like a
  // duplicate render: Pip fell silent and the microphone never reopened.
  const key = state.screen + ":" + (clip || "") + ":" + state.qSerial;
  if(!force && key === lastSpoken) return;
  lastSpoken = key;
  KideVoice.mic.stop();
  KideVoice.mic.indicator("idle");
  if(!clip){ return; }
  if(!voiceOn()){ maybeListen(); return; }
  const screenAtStart = state.screen;
  const hint = listenHintClip();
  const needHint = listenOn() && hint && !levelHintGiven[hintScope()];
  if(needHint) levelHintGiven[hintScope()] = true;

  // The nudge comes BEFORE the question, not after. A two-year-old who hears
  // "Find something red!" and then three seconds of instructions has forgotten
  // the question by the time the microphone opens. Last thing heard should be
  // the thing they have to answer.
  const line = needHint
    ? say(hint).then(function(ok){ return ok ? say(clip) : false; })
    : say(clip);

  line.then(function(finished){
    // false ⇒ a newer line or a screen change cut this one off; its follow-up
    // would be acting on a screen that no longer exists.
    if(!finished || state.screen !== screenAtStart) return;
    maybeListen();
  });
}

function maybeListen(){
  if(!listenOn()) return;

  // Picking a game out loud.
  if(state.screen === "garden"){
    KideVoice.mic.listen({
      vocab: gardenVocab(),
      onState: function(s){ KideVoice.mic.indicator(s); },
      onMatch: function(level){
        KideVoice.mic.indicator("idle");
        const card = document.querySelector('[data-act="playlevel"][data-level="'+level+'"]');
        if(card) card.click();
      },
      onNoMatch: function(){ KideVoice.mic.indicator("idle"); }   // silent — the garden isn't a quiz
    });
    return;
  }

  // Saying goodnight out loud.
  if(state.screen === "play" && document.querySelector(".invite")){
    KideVoice.mic.listen({
      vocab: [{ key:"yes", value:"yes" }, { key:"no", value:"no" }],
      onState: function(s){ KideVoice.mic.indicator(s); },
      onMatch: function(v){
        KideVoice.mic.indicator("idle");
        if(v === "yes") goToGoodbye(); else { removeInvite(); maybeListen(); }
      },
      onNoMatch: function(){ KideVoice.mic.indicator("idle"); maybeListen(); }
    });
    return;
  }

  if(state.screen !== "play" || state.awaitingNext) return;
  const vocab = questionVocab();
  if(!vocab.length) return;
  KideVoice.mic.listen({
    vocab: vocab,
    onState: function(s){ KideVoice.mic.indicator(s); },
    onMatch: function(value){
      KideVoice.mic.indicator("idle");
      const btn = document.querySelector('#optWrap [data-val="' + value + '"]:not(.collected)');
      // The child SPOKE and was understood -- this is the one path that
      // produces genuine speech evidence rather than adherence only.
      if(btn){ answerSource = "voice"; answerWith(btn); }
      else maybeListen();
    },
    onNoMatch: function(){
      KideVoice.mic.indicator("idle");
      // Heard something, could not match it. Recorded as an unsure SPOKEN
      // attempt: leaving it out would quietly bias the record upward by
      // dropping exactly the attempts that did not go well.
      if(state.q) recordPractice(state.q.target, false, "voice");
      listenTries++;
      if(listenTries >= 2) return;  // then it's tap-only, no nagging
      const at = state.screen;
      say("listen-again").then(function(ok){ if(ok && state.screen === at) maybeListen(); });
    },
    onError: function(err){
      KideVoice.mic.indicator("idle");
      // A refused or broken mic is permanent for this session — never re-prompt a child.
      if(err === "not-allowed" || err === "service-not-allowed" || err === "audio-capture"){
        micStatus = "unsupported";
      }
    }
  });
}


/* ------------------------------ sparkles --------------------------------- */
function sparkleBurst(x,y,count){
  const icons = ["✨","⭐","🌟"];
  for(let i=0;i<(count||10);i++){
    const s = document.createElement("div");
    s.className = "sparkle";
    s.textContent = pick(icons);
    const ang = Math.random()*Math.PI*2, dist = 40+Math.random()*70;
    s.style.left = x+"px"; s.style.top = y+"px";
    s.style.setProperty("--dx", Math.cos(ang)*dist+"px");
    s.style.setProperty("--dy", Math.sin(ang)*dist+"px");
    s.style.setProperty("--rot", (Math.random()*240-120)+"deg");
    document.body.appendChild(s);
    setTimeout(()=>s.remove(), 900);
  }
}
function burstFromEl(node,count){
  const r = node.getBoundingClientRect();
  sparkleBurst(r.left+r.width/2, r.top+r.height/2, count);
}

const app = document.getElementById("app");

function clouds(){
  return '<div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>';
}

function render(){
  document.body.className = bodyStageClass();
  app.innerHTML = "";
  app.insertAdjacentHTML("afterbegin", clouds());
  const wrap = document.createElement("div");
  wrap.className = "screen" + (state.screen==="settings" ? " scroll" : "");
  wrap.appendChild(renderScreen());
  app.appendChild(wrap);
  wireScreen();
  speakScreen();
}

function bodyStageClass(){
  // The goodbye screen was written for the night sky — white heading, #EAF0FF
  // body copy, a translucent recap card. Without this it rendered on the
  // daytime gradient and its own text nearly vanished, on the one screen the
  // whole product is built around.
  if(state.screen==="goodbye") return "stage-sleepy";
  if(state.screen!=="play") return "";
  const frac = sessionFraction();
  if(frac>=1) return "stage-sleepy";
  if(frac>=0.85) return "stage-dusk";
  if(frac>=0.5) return "stage-warm";
  return "";
}

function sessionFraction(){
  if(!state.sessionStart) return 0;
  const len = (settings.sessionMinutes||8)*60*1000;
  return Math.min(1.4, (Date.now()-state.sessionStart)/len);
}

function renderScreen(){
  if(state.screen==="home") return screenHome();
  if(state.screen==="handoff") return screenHandoff();
  if(state.screen==="hello") return screenHello();
  if(state.screen==="consent") return screenConsent();
  if(state.screen==="garden") return screenGarden();
  if(state.screen==="play") return screenPlay();
  if(state.screen==="routine") return screenRoutine();
  if(state.screen==="goodbye") return screenGoodbye();
  if(state.screen==="gate") return screenGate();
  if(state.screen==="settings") return screenSettings();

function newQuestion(levelKey){
  const lv = progress[levelKey];
  state.missOnQuestion = 0;
  state.qSerial++;
  listenTries = 0;
  if(levelKey==="colors"){
    const tier = COLOR_TIERS[lv.tier];
    const target = pick(tier.pool);
    const distractors = shuffle(tier.pool.filter(c=>c!==target)).slice(0, tier.choices-1);
    const optionsArr = shuffle([target, ...distractors]);
    state.question = { type:"colors", target, options: optionsArr };
  }else if(levelKey==="counting"){
    const tier = COUNT_TIERS[lv.tier];
    const target = tier.min + Math.floor(Math.random()*(tier.max-tier.min+1));
    const item = pick(COUNT_ITEMS);
    const optSet = new Set([target]);
    while(optSet.size<tier.choices){
      let d = target + (Math.random()<0.5?-1:1)*(1+Math.floor(Math.random()*2));
      if(d<1) d = target+1;
      if(d>=1) optSet.add(d);
    }
    state.question = { type:"counting", target, item, options: shuffle([...optSet]) };
  }else if(levelKey==="letters"){
    const tier = LETTER_TIERS[lv.tier] || LETTER_TIERS[4];
    // Tier 1 leads with the letters of the name the child chose, when there is
    // one — the own-name advantage is the single largest effect available here
    // and it costs nothing to use. Everything the child's name does not cover
    // falls back to the tier pool.
    const own = lv.tier === 1 ? ownNameLetters().filter(function(l){ return ALL_LETTERS.indexOf(l) > -1; }) : [];
    const pool = tier.pool;
    const target = (own.length && Math.random() < 0.6) ? pick(own) : pick(pool);
    // Distractors come from the tier pool, minus anything a child of this age
    // confuses with the target by shape while still learning what it is.
    let candidates = pool.concat(own).filter(function(l){ return l !== target; });
    candidates = candidates.filter(function(l, i, a){ return a.indexOf(l) === i; });
    if(tier.avoidConfusable){
      const bad = LETTER_CONFUSABLE[target] || [];
      const safe = candidates.filter(function(l){ return bad.indexOf(l) === -1; });
      if(safe.length >= tier.choices - 1) candidates = safe;
    }
    const distractors = shuffle(candidates).slice(0, tier.choices - 1);
    state.question = { type:"letters", target, options: shuffle([target, ...distractors]),
                       fromName: own.indexOf(target) > -1 ? readCompanionName() : null };
  }else if(levelKey==="feelings"){
    const tier = FEELING_TIERS[lv.tier] || FEELING_TIERS[4];
    // Situations before faces: children read emotions from what happened before
    // they can read them off a face, so tier 1 is stories only and faces are
    // eased in afterwards.
    const useStory = tier.storyOnly || Math.random() < 0.5;
    const pool = tier.pool;
    if(useStory){
      const inPool = FEELING_STORIES.filter(function(s){ return pool.indexOf(s.feel) > -1; });
      const story = pick(inPool);
      const distractors = shuffle(pool.filter(function(f){ return f !== story.feel; })).slice(0, tier.choices - 1);
      state.question = { type:"feelings-story", target: story.feel, story,
                         options: shuffle([story.feel, ...distractors]) };
    }else{
      const target = pick(pool);
      const distractors = shuffle(pool.filter(function(f){ return f !== target; })).slice(0, tier.choices - 1);
      state.question = { type:"feelings-face", target, options: shuffle([target, ...distractors]) };
    }
  }else if(levelKey==="shapes"){
    const tier = SHAPE_TIERS[lv.tier];
    if(tier.collect){
      const target = pick(tier.pool);
      const others = tier.pool.filter(s=>s!==target);
      const targetCount = 3;
      const otherCount = tier.gridSize - targetCount;
      let tiles = Array(targetCount).fill(target);
      for(let i=0;i<otherCount;i++) tiles.push(pick(others));
      tiles = shuffle(tiles);
      state.question = { type:"shapes-collect", target, tiles, need: targetCount, got: 0 };
      state.collected = [];
    }else{
      const target = pick(tier.pool);
      const distractors = shuffle(tier.pool.filter(s=>s!==target)).slice(0, Math.min(2, tier.pool.length-1));
      state.question = { type:"shapes-pick", target, options: shuffle([target, ...distractors]) };
    }
  }
}

function shapeSvg(shape, fill){
  fill = fill || "#4EA8DE";
  if(shape==="circle") return '<svg viewBox="0 0 100 100" class="shape-svg"><circle cx="50" cy="50" r="42" fill="'+fill+'"/></svg>';
  if(shape==="square") return '<svg viewBox="0 0 100 100" class="shape-svg"><rect x="12" y="12" width="76" height="76" rx="14" fill="'+fill+'"/></svg>';
  return '<svg viewBox="0 0 100 100" class="shape-svg"><polygon points="50,10 90,88 10,88" fill="'+fill+'" stroke-linejoin="round"/></svg>';
}

  tp:     "left:36%;top:44%;width:12%;height:14%;",
  sink:   "left:47%;top:51%;width:24%;height:13%;",

function rStep(){
  const r = state.routine;
  return r ? r.steps[r.i] : null;
}

function screenRoutine(){
  const r = state.routine, st = rStep();
  const c = document.createElement("div");
  c.style.width="100%"; c.style.display="flex"; c.style.flexDirection="column"; c.style.alignItems="center";
  c.style.flex="1";
  const flags = st.flags || [];
  const hit = st.hit && R_HITBOX[st.hit] ? '<i class="sc-hit on" style="'+R_HITBOX[st.hit]+'"></i>' : "";
  const bubbles = flags.indexOf("bubbles") > -1
    ? '<i class="bub" style="left:62%;bottom:36%;width:14px;height:14px;"></i>'+
      '<i class="bub" style="left:68%;bottom:34%;width:10px;height:10px;animation-delay:.7s"></i>'+
      '<i class="bub" style="left:58%;bottom:33%;width:8px;height:8px;animation-delay:1.4s"></i>'
    : "";
  const dots = r.steps.map(function(_,i){
    return '<i class="'+(i < r.i ? "done" : (i === r.i ? "now" : ""))+'"></i>';
  }).join("");
  c.innerHTML =
    '<div class="topbar">'+
      '<button class="icon-btn" data-act="garden" aria-label="Back">🌿</button><div class="spacer"></div>'+
      '<button class="icon-btn" data-act="parents" aria-label="Parents">⚙️</button>'+
    '</div>'+
    '<div class="routine-head">'+
      '<div class="r-say">'+st.say+'</div>'+
      '<div class="r-cue">'+(st.cue || "")+'</div>'+
    '</div>'+
    '<div class="scene '+(st.pos || "")+'" id="scene">'+
      sceneSvg()+
      '<div class="sc-pip'+'">'+pipHTML({ celebrate: !!st.end })+'</div>'+
      hit + bubbles +
    '</div>'+
    '<div class="step-dots">'+dots+'</div>'+
    (st.end
      ? '<div class="routine-foot">'+
          '<button class="btn btn-primary" data-act="routine-again">Again!</button>'+
          '<button class="btn btn-secondary" data-act="garden">Pip\'s Garden</button>'+
        '</div>'
      : "");
  /* Fade in only the props this step calls for. */
  const svg = c.querySelector("svg");
  flags.forEach(function(f){
    const n = svg.querySelector('[data-p="'+f+'"]');
    if(n) n.classList.add("show");
  });
  return c;
}

/* One tap = one step. There is no wrong tap and no way to fail, which is the
   whole point: the child is rehearsing a sequence, not being assessed on it. */
function routineTap(){
  const r = state.routine, st = rStep();
  if(!r || !st || st.end) return;
  if(st.repeat && (r.taps + 1) < st.repeat){ r.taps++; sfxTry(); return; }
  r.taps = 0; r.i++;
  state.qSerial++;
  const now = rStep();
  if(now && now.end){ sfxCelebrate(); progress.routineRuns = (progress.routineRuns || 0) + 1; saveJSON(STORE_KEY, progress); }
  else sfxCorrect();
  render();
}

function startRoutine(key){
  const def = ROUTINES[key];
  if(!def) return;
  const outcome = R_OUTCOMES[(progress.routineRuns || 0) % R_OUTCOMES.length];
  state.routine = { key: key, steps: def.build(outcome), i: 0, taps: 0 };
  state.screen = "routine";
  state.qSerial++;
  startSessionIfNeeded();
  render();
}

/* The explicit parent -> child handoff.

   Two taps, on purpose. The grown-up sees exactly what is switched on, and
   their tap ends their turn; the child's tap on the next screen begins
   theirs. It doubles as the audio-unlock gesture iOS requires, so the
   privacy moment and the technical moment are the same moment. */
function screenHandoff(){
  const c = document.createElement("div");
  c.style.width="100%"; c.style.display="flex"; c.style.flexDirection="column";
  c.style.alignItems="center"; c.style.flex="1"; c.style.justifyContent="center";

  const speaking = voiceOn();
  const hearing  = listenOn();
  const micChip = hearing
    ? '<div class="chip on"><span class="ci">🎤</span>Pip listens for answers<span class="cs">ON</span></div>'
    : (micStatus === "available"
        ? '<div class="chip off"><span class="ci">🎤</span>Pip listens for answers<span class="cs">OFF</span></div>'
        : '<div class="chip na"><span class="ci">🎤</span>Listening<span class="cs">NOT ON THIS DEVICE</span></div>');

  c.innerHTML =
    '<div class="handoff-card">'+
      '<h2>Passing it over?</h2>'+
      '<p>Here\'s exactly what\'s switched on before your child takes over.</p>'+
      '<div class="chips">'+
        '<div class="chip '+(speaking?"on":"off")+'"><span class="ci">🔊</span>Pip speaks each question<span class="cs">'+(speaking?"ON":"OFF")+'</span></div>'+
        micChip+
        '<div class="chip on"><span class="ci">🔒</span>Nothing leaves this device<span class="cs">ALWAYS</span></div>'+
      '</div>'+
      '<div class="handoff-actions">'+
        '<button class="btn btn-primary big" data-act="handover">Hand it over</button>'+
        '<button class="tiny-link" data-act="parents">Parent Corner</button>'+
      '</div>'+
    '</div>';
  return c;
}

/* Child-facing. The first thing they ever tap is Pip saying hello to them. */
function screenHello(){

/* Grown-ups only (reached through the maths gate). Plain language, and it
   states what this specific device actually does rather than a generic
   promise we can't verify. */
function screenConsent(){
  const c = document.createElement("div");
  c.style.width="100%"; c.style.display="flex"; c.style.flexDirection="column";
  c.style.alignItems="center"; c.style.flex="1";
  const granted = !!(window.KideVoice && KideVoice.consent.get());

  let body, actions;
  if(micStatus === "unsupported"){
    body = '<p>This browser can\'t recognise speech without sending your child\'s voice to a company\'s servers — so we don\'t offer it here. Pip will keep speaking, and your child keeps answering by tapping.</p>'+
           '<p class="mic-state">Listening currently works in Chrome on a computer or Android device, where the speech model runs on the device itself. It will switch on here automatically if that ever changes.</p>';
    actions = '<button class="btn btn-secondary" data-act="parents-back">Back</button>';
  }else if(granted){
    body = '<p><b>Pip\'s listening is on.</b> Your child can say an answer out loud instead of tapping.</p>'+
           '<p class="mic-state">Speech is recognised by the model on this device. No audio is recorded, saved, or sent anywhere — what your child says becomes a word in this browser\'s memory for a fraction of a second, and is then gone.</p>';
    actions = '<button class="btn btn-ghost" data-act="revoke-listen">Turn listening off</button>'+
              '<button class="btn btn-secondary" data-act="parents-back" style="margin-top:10px">Back</button>';
  }else{
    const dl = (micStatus === "downloadable" || micStatus === "downloading");
    body = '<p>Pip can listen for spoken answers, so your child can just say <i>"red!"</i> instead of tapping. It\'s optional, and tapping always works.</p>'+
           '<p class="mic-state"><b>Where your child\'s voice goes:</b> nowhere. On this device the speech model runs locally, so audio is never recorded, stored, or transmitted. Pip only ever compares what was said against the two or three answers on screen, then forgets it.</p>'+
           (dl ? '<p class="mic-state">Your browser needs to download a one-time offline speech pack first (about 50&nbsp;MB). We won\'t start that without you.</p>' : '');
    actions = '<button class="btn btn-primary" data-act="grant-listen">'+(dl?"Download &amp; turn on":"Turn on listening")+'</button>'+
              '<button class="btn btn-ghost" data-act="parents-back" style="margin-top:10px">Not now</button>';
  }

  c.innerHTML =
    '<div class="consent-card">'+
      '<div class="p-eyebrow" style="color:var(--ink-soft);font-weight:700">GROWN-UPS ONLY</div>'+
      '<h2>Let Pip listen?</h2>'+ body +
      '<div class="handoff-actions" style="margin-top:18px" id="consentActions">'+actions+'</div>'+
    '</div>';
  return c;
}

/* Last-7-day handoff summary, computed on the fly from local storage only. */
function handoffSummary(){
  const list = Array.isArray(progress.handoffs) ? progress.handoffs : [];
  const since = Date.now() - 7*24*60*60*1000;
  const recent = list.filter(function(h){ return h && typeof h.s === "number" && h.s >= since; });
  return { total: recent.length, good: recent.filter(function(h){ return h.g; }).length };
}

function handoffCardHTML(){
  const s = handoffSummary();
  if(s.total === 0){
    return '<div class="settings-card">'+
      '<h3>Your week with Pip</h3>'+
      '<p>Once you\'ve handed Pip over a few times, this is where you\'ll see how the goodbyes are going. It stays on this device — we never see it.</p>'+
    '</div>';
  }
  const times = s.total === 1 ? "once" : s.total + " times";
  let note;
  if(s.good === s.total){
    note = "Every one ended with a goodbye. That’s the habit, and it’s holding.";
  }else if(s.good === 0){
    note = "None have ended with a goodbye yet. That’s completely normal early on — the ritual usually takes a couple of weeks before a child reaches for it.";
  }else{
    note = "Ending on Pip’s terms rather than mid-game is the whole habit. It builds slowly, and a mixed week is a week it’s working.";
  }
  /* The share sits HERE and nowhere else.

     The obvious place looks like the goodbye screen — it's the emotional peak.
     But the goodbye screen is child-facing; the person holding the device there
     is two. This card is behind the grown-ups gate, it is the moment a parent
     has just been shown evidence the thing worked, and the evidence is the only
     part another parent would care about. Nothing is uploaded to build it: the
     numbers come from this device and the text is composed here. */
  const shareable = s.good >= 2;
  /* The practice record lives behind the same grown-ups gate. It is the only
     place the speech-practice evidence surfaces, and it must never be reachable
     from a child-facing screen: per-attempt outcomes are surfaced to nobody,
     and a child seeing anything that looks like a score is the failure mode the
     whole design exists to avoid. */
  return '<div class="settings-card">'+
    '<h3>Your week with Pip</h3>'+
    '<p style="font-size:17px;color:var(--ink)"><b>You handed Pip over '+times+'.</b> '+s.good+' ended with a goodbye.</p>'+
    '<p>'+note+'</p>'+
    (shareable
      ? '<button class="btn btn-secondary" id="shareWeek" style="font-size:15px;padding:11px 20px;margin-top:6px">Tell another parent</button>'+
        '<div class="lead-ok" id="shareOk" style="display:none">Copied — paste it anywhere.</div>'
      : '')+
    '<p style="margin-top:14px"><a href="/parent/" style="font-weight:800;color:var(--sand-deep);'+
      'display:inline-flex;align-items:center;min-height:44px">Speech practice this week &rarr;</a></p>'+
  '</div>';
}

/* Native share sheet where there is one (which is where parents actually are),
   clipboard everywhere else. Never a social-network button: those need their
   scripts on the page, and this site does not run other people's scripts. */
function shareWeek(){
  const s = handoffSummary();
  const text = s.good === s.total
    ? "All "+s.total+" of our screen-time sessions this week ended with my kid saying goodnight — instead of me taking the tablet away. Pip gets sleepy and asks to be tucked in."
    : s.good+" of our last "+s.total+" screen-time sessions ended with my kid saying goodnight — instead of me taking the tablet away. Pip gets sleepy and asks to be tucked in.";
  const url = "https://kide.us";
  const done = function(){
    const ok = document.getElementById("shareOk");
    if(ok){ ok.style.display = "block"; setTimeout(function(){ ok.style.display = "none"; }, 4000); }
  };
  if(navigator.share){
    navigator.share({ title: "Kide", text: text, url: url }).catch(function(){});
    return;
  }
  const payload = text + "\n\n" + url;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(payload).then(done).catch(function(){ window.prompt("Copy this:", payload); });
  }else{
    window.prompt("Copy this:", payload);
  }
}
