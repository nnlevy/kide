<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Made for you · Kide</title>
<link rel="canonical" href="https://kide.us/play/made">
<meta name="description" content="Lessons a grown-up approved, ready to say with Pip.">
<meta property="og:title" content="Made for you · Kide">
<meta property="og:description" content="Lessons a grown-up approved, ready to say with Pip.">
<meta property="og:image" content="https://kide.us/og-card.png">
<link rel="stylesheet" href="/mobile.css">
<style>
  :root{
    --cream:#FFFBF2; --ink:#2E3A3F; --ink-soft:#5B6A67; --sunstone:#E17C5B; --grass:#6FD08C;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:linear-gradient(180deg,#BDEBFF,#FFFBF2 40%);color:var(--ink);line-height:1.4;
    padding:20px 16px calc(40px + env(safe-area-inset-bottom,0px))}
  .wrap{max-width:640px;margin:0 auto}
  h1{font-size:32px;margin:0 0 8px;animation:rise .35s ease both}
  p{font-size:18px;margin:0 0 14px}
  a.play{font:inherit;font-size:20px;font-weight:800;min-height:56px;min-width:56px;width:100%;
    margin:0 0 12px;padding:14px 16px;border:none;border-radius:20px;background:#fff;color:var(--ink);
    display:flex;align-items:center;justify-content:center;text-decoration:none;
    animation:rise .4s ease both}
  .grownup-zone{margin:28px auto 4px;border-top:2px dashed #D9D1C2;padding-top:16px;text-align:center}
  .grownup-zone summary{cursor:pointer;color:var(--ink-soft);font-size:14px;font-weight:800;min-height:44px;padding:10px}
  .grownup-zone a{color:var(--ink-soft);font-weight:700;padding:10px;min-height:44px;display:inline-flex;align-items:center}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){
    h1,a.play{animation:none}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Made for you</h1>
  <p id="note">Ask a grown-up. Nothing is ready to play yet.</p>
  <div id="lessons"></div>
  <details class="grownup-zone">
    <summary>Grown-ups</summary>
    <a href="/parent/studio/">Lesson Studio</a>
    <a href="/words">Say it with me</a>
  </details>
</div>
<script type="module">
const note = document.getElementById("note");
const lessonsEl = document.getElementById("lessons");

try {
  const res = await fetch("/api/studio/playlist", { credentials: "same-origin" });
  const data = await res.json().catch(() => ({}));
  const lessons = Array.isArray(data.lessons) ? data.lessons : [];
  if (!res.ok) {
    note.textContent = "Ask a grown-up. Nothing is ready to play yet.";
  } else if (!lessons.length) {
    note.textContent = "Nothing here yet. A grown-up picks one first.";
  } else {
    note.textContent = "Pick one.";
    for (const lesson of lessons) {
      const a = document.createElement("a");
      a.className = "play";
      a.href = `/words/?made=${encodeURIComponent(lesson.id)}`;
      a.textContent = lesson.title;
      lessonsEl.appendChild(a);
    }
  }
} catch {
  note.textContent = "Ask a grown-up. Nothing is ready to play yet.";
}
</script>
</body>
</html>
